class GameScene extends Phaser.Scene {
  constructor() { super({ key: 'Game', physics: MATTER_SCENE_CONFIG }); }

  create() {
    const L = CONFIG.layout;
    // All per-run state is reset here so restarts start clean.
    this.skin = skinById(Save.data.skin);
    this.workers = [];
    this.state = 'intro';
    this.floor = 1;
    this.ridesSurvived = 0;
    this.score = 0;
    this.delivered = 0;
    this.launchedCount = 0;
    this.flightDistance = 0;
    this.flightBonus = 0;
    this.acc = 0;
    this.hitstop = 0;
    this.weight = 0;
    this.closeWeight = 0;
    this.sag = 0;
    this.doorL = { p: 1 };   // door progress: 1 = closed, 0 = open
    this.doorR = { p: 1 };
    this.loadTimer = 0;
    this.boardClock = 0;
    this.holding = false;
    this.doorsPress = null;
    this.drag = null;
    this.snapped = false;
    this.ended = false;
    this.creakCD = 1000;
    this.alarmCD = 0;
    this.shakeCD = 0;
    this.sparkCD = 0;
    this.flickerT = 0;
    this.rideT = 0;
    this.deliverT = 0;
    this.carFallY = 0;
    this.carFallV = 0;
    this.cableSnapT = 0;
    this.timeScale = 1;
    this.frame = 0;
    this.carCX = (L.carLeft + L.carRight) / 2;

    this.cameras.main.setBackgroundColor(CONFIG.colors.skyStops[0][1]);
    this.createBackdrop();
    this.buildBuilding();
    this.createCar();
    this.createParticles();
    this.createHUD();
    this.setupInput();
    this.setDoorsUI(false);

    Sound.setIntensity(0);
    this.time.delayedCall(250, () => this.beginFloor());
  }

  // ---- world ------------------------------------------------------------
  createBackdrop() {
    const W = CONFIG.width, H = CONFIG.height;
    this.stars = this.add.graphics().setScrollFactor(0).setDepth(0).setAlpha(0);
    this.stars.fillStyle(0xffffff);
    for (let i = 0; i < 120; i++) this.stars.fillCircle(rand(0, W), rand(0, H), rand(0.8, 2.2));
    this.skyline = this.add.image(W / 2, CONFIG.layout.floorY - 10, 'skyline').setOrigin(0.5, 1).setScrollFactor(0.2).setDepth(1);
    this.clouds = [];
    for (let i = 0; i < 7; i++) {
      this.clouds.push(this.add.image(rand(0, W), -rand(300, 2600), 'cloud').setDepth(2).setScale(rand(0.7, 1.4)).setAlpha(0.9));
    }
    this.speedLines = [];
    for (let i = 0; i < 16; i++) {
      this.speedLines.push(this.add.image(rand(0, W), rand(0, H), 'speedline').setScrollFactor(0).setDepth(60).setAlpha(0).setScale(1, rand(0.6, 1.6)));
    }
  }

  buildBuilding() {
    const L = CONFIG.layout;
    const H = L.floorHeight;
    if (this.roofLight) this.tweens.killTweensOf(this.roofLight);
    if (this.building) this.building.destroy();
    this.building = this.add.container(0, 0).setDepth(5);
    const top = CONFIG.floorsPerRun + 1 - this.floor; // floors above the current one
    for (let i = -1; i <= top; i++) {
      const floorNo = this.floor + i;
      const y = L.floorY - L.slabTop - i * H;
      this.building.add(this.add.image(CONFIG.width / 2, y, 'floorTile').setOrigin(0.5, 0));
      if (floorNo >= 1) {
        const name = CONFIG.floorNames[floorNo - 1] || `LEVEL ${floorNo}`;
        const sign = this.add.text(1000, y + 18, `${floorNo}F  ${name}`, {
          fontFamily: FONT, fontSize: '18px', color: '#ffffff', backgroundColor: '#2f6f4f', padding: { x: 10, y: 4 },
        }).setOrigin(0.5, 0);
        this.building.add(sign);
      }
    }
    const roofBottom = L.floorY - L.slabTop - top * H; // top edge of the highest floor
    this.roof = this.add.image(CONFIG.width / 2, roofBottom, 'roof').setOrigin(0.5, 1);
    this.building.add(this.roof);
    this.roofLight = this.add.circle(200, roofBottom - 250, 9, 0xff4757);
    this.building.add(this.roofLight);
    this.tweens.add({ targets: this.roofLight, alpha: 0.15, duration: 600, yoyo: true, repeat: -1 });
    this.building.add(this.add.text(215, L.floorY - 70, 'EXIT', {
      fontFamily: FONT, fontSize: '18px', color: '#ffffff', backgroundColor: '#1f9d55', padding: { x: 8, y: 3 },
    }).setOrigin(0.5, 0));
    this.pulleyY = roofBottom - 120;
  }

  createCar() {
    const L = CONFIG.layout;
    const skin = this.skin;
    const w = L.carRight - L.carLeft;
    const h = L.floorY - L.carTop;
    const T = L.wall;
    ensureSkinTex(this, skin);

    // visuals: back wall behind workers, frame in front
    this.carBack = this.add.container(0, 0).setDepth(10);
    this.carBack.add(this.add.image(this.carCX, L.carTop + h / 2, `carBack_${skin.id}`));
    this.lamp = this.add.rectangle(this.carCX, L.carTop + 10, w - 60, 12, 0xfff8d6).setStrokeStyle(3, CONFIG.colors.ink);
    this.glow = this.add.rectangle(this.carCX, L.carTop + 70, w - 8, 120, 0xfff3b0, 0.18);
    this.carBack.add([this.glow, this.lamp]);

    this.carFront = this.add.container(0, 0).setDepth(30);
    this.header = this.add.image(this.carCX, L.carTop - 32, `carHeader_${skin.id}`);
    this.floorStrip = this.add.image(this.carCX, L.floorY + 22, `carFloor_${skin.id}`);
    this.indicator = this.add.text(this.carCX, L.carTop - 36, '1', {
      fontFamily: 'Courier New, monospace', fontSize: '30px', fontStyle: 'bold', color: '#ff3b3b',
    }).setOrigin(0.5);
    this.arrow = this.add.text(this.carCX + 30, L.carTop - 38, '▲', { fontFamily: UI_FONT, fontSize: '18px', color: '#ff3b3b' }).setOrigin(0.5).setAlpha(0);
    this.carFront.add([this.header, this.floorStrip, this.indicator, this.arrow]);
    this.doorImgL = this.add.image(L.carLeft - T / 2, 0, `carDoor_${skin.id}`).setDepth(31);
    this.doorImgR = this.add.image(L.carRight + T / 2, 0, `carDoor_${skin.id}`).setDepth(31);
    this.cable = this.add.graphics().setDepth(9);
    this.frayAngles = [];
    for (let i = 0; i < 6; i++) this.frayAngles.push(rand(0.4, 1.1) * (i % 2 ? 1 : -1));

    // physics: lobby floors, car floor, ceiling, and the two doors
    const world = { isStatic: true, friction: 0.9, collisionFilter: { group: 0, category: CAT.WORLD, mask: 0xffff } };
    const door = { isStatic: true, friction: 0.3, collisionFilter: { group: 0, category: CAT.DOOR, mask: CAT.BODY } };
    const add = this.matter.add;
    this.groundL = add.rectangle((L.carLeft - T - 600) / 2, L.floorY + 30, L.carLeft - T + 600, 60, world);
    this.groundR = add.rectangle((L.carRight + T + 2400) / 2, L.floorY + 30, 2400 - L.carRight - T, 60, world);
    this.carFloor = add.rectangle(this.carCX, L.floorY + 30, w + T * 2, 60, Object.assign({}, world, { chamfer: { radius: 4 } }));
    this.ceiling = add.rectangle(this.carCX, L.carTop - 20, w + T * 2, 40, world);
    this.doorBodyL = add.rectangle(L.carLeft - T / 2, L.carTop + h / 2, T, h, door);
    this.doorBodyR = add.rectangle(L.carRight + T / 2, L.carTop + h / 2, T, h, door);
    this.syncCar(true);
  }

  // Position the car's static bodies and visuals from sag + door progress
  syncCar(force) {
    const L = CONFIG.layout;
    const h = L.floorY - L.carTop;
    const T = L.wall;
    const s = this.sag;
    if (force || this.lastSag !== s) {
      setPos(this.carFloor, this.carCX, L.floorY + 30 + s);
      if (!this.snapped) setPos(this.ceiling, this.carCX, L.carTop - 20 + s);
      this.lastSag = s;
    }
    // A door slides down from the ceiling: bottom edge at carTop + p*h
    const yL = L.carTop - h / 2 + this.doorL.p * h + s;
    const yR = L.carTop - h / 2 + this.doorR.p * h + s;
    if (force || this.lastDoorL !== yL) { setPos(this.doorBodyL, L.carLeft - T / 2, yL); this.lastDoorL = yL; }
    if (force || this.lastDoorR !== yR) { setPos(this.doorBodyR, L.carRight + T / 2, yR); this.lastDoorR = yR; }
  }

  updateCarVisuals() {
    const L = CONFIG.layout;
    const h = L.floorY - L.carTop;
    const off = this.sag + this.carFallY;
    this.carBack.y = off;
    this.carFront.y = off;
    // The door body slides down out of the ceiling; show only the part below carTop.
    const place = (img, p, x) => {
      const vis = Math.max(0.001, p);
      img.setCrop(0, h * (1 - vis), L.wall, h * vis);
      img.setPosition(x, L.carTop - h / 2 + p * h + off);
      img.setVisible(p > 0.01);
    };
    place(this.doorImgL, this.doorL.p, L.carLeft - L.wall / 2);
    place(this.doorImgR, this.doorR.p, L.carRight + L.wall / 2);
  }

  createParticles() {
    const P = (key, cfg, depth) => this.add.particles(0, 0, key, Object.assign({ emitting: false }, cfg)).setDepth(depth || 45);
    const spin = { onEmit: () => rand(0, 360), onUpdate: (p, k, t, v) => v + 7 };
    this.fx = {
      confetti: P('confetti', {
        lifespan: 2600, speed: { min: 220, max: 700 }, angle: { min: 200, max: 340 }, gravityY: 420,
        rotate: spin, scale: { min: 0.8, max: 1.5 }, tint: CONFIG.colors.confetti, alpha: { start: 1, end: 0.3 },
      }),
      paper: P('paper', {
        lifespan: 3200, speed: { min: 150, max: 520 }, angle: { min: 200, max: 340 }, gravityY: 160,
        rotate: spin, scaleX: { onEmit: () => 1, onUpdate: (p, k, t) => Math.cos(t * 30) }, alpha: { start: 1, end: 0.2 },
      }),
      debris: P('debris', {
        lifespan: 1800, speed: { min: 150, max: 520 }, angle: { min: 200, max: 340 }, gravityY: 900,
        rotate: spin, tint: this.skin.frame, scale: { min: 0.8, max: 1.8 },
      }),
      sparks: P('spark', {
        lifespan: 450, speed: { min: 80, max: 260 }, angle: { min: 0, max: 360 }, gravityY: 600, scale: { start: 1, end: 0 },
      }),
      coffee: P('dot', {
        lifespan: 700, speed: { min: 40, max: 160 }, angle: { min: 200, max: 340 }, gravityY: 700,
        scale: { start: 0.55, end: 0.2 }, tint: 0x6f4e37,
      }),
      trail: P('dot', {
        lifespan: 520, speed: 0, scale: { start: 1.2, end: 0 }, alpha: { start: 0.7, end: 0 }, tint: 0xffffff,
      }, 19),
      puff: P('puff', {
        lifespan: 600, speed: { min: 20, max: 90 }, angle: { min: 0, max: 360 }, scale: { start: 0.8, end: 2 }, alpha: { start: 0.9, end: 0 },
      }),
    };
    this.emitters = Object.values(this.fx);
  }

  // ---- HUD ----------------------------------------------------------------
  createHUD() {
    const W = CONFIG.width, H = CONFIG.height;
    const hud = (o, d) => o.setScrollFactor(0).setDepth(d || 100);
    this.scoreText = hud(this.add.text(24, 16, 'SCORE 0', textStyle(32, '#ffffff', { align: 'left' })));
    this.floorText = hud(this.add.text(24, 60, '', textStyle(22, '#ffd23f', { align: 'left' })));

    const gx = W / 2, gy = 126;
    this.gaugeGroup = [
      hud(this.add.image(gx, gy - 56, 'gaugeFace')),
      hud(this.add.image(gx, gy, 'needle').setOrigin(0.5, 0.92), 101),
    ];
    this.needle = this.gaugeGroup[1];
    this.loadText = hud(this.add.text(gx, gy + 20, 'LOAD 0/10', textStyle(22, '#ffffff')).setOrigin(0.5, 0));
    this.riskText = hud(this.add.text(gx, gy + 48, 'SNAP RISK 0%', textStyle(18, '#3ddc84')).setOrigin(0.5, 0));
    this.gaugeGroup.push(this.loadText, this.riskText);

    this.muteBtn = hud(this.add.image(W - 44, 44, Save.data.muted ? 'iconMute' : 'iconSound').setInteractive({ useHandCursor: true }), 105);
    this.muteBtn.on('pointerup', () => {
      Sound.unlock();
      Save.data.muted = !Save.data.muted;
      Sound.setMuted(Save.data.muted);
      Save.write();
      this.muteBtn.setTexture(Save.data.muted ? 'iconMute' : 'iconSound');
    });

    // DOORS button: tap = close and go, hold = keep doors open
    const bx = W - 110, by = H - 96;
    this.doorsRing = hud(this.add.graphics(), 102);
    this.doorsBtn = hud(this.add.image(bx, by, 'doorsBtn').setInteractive({ useHandCursor: true }), 103);
    this.doorsLabel = hud(this.add.text(bx, by + 56, 'DOORS', textStyle(22, '#ffffff')).setOrigin(0.5, 0), 104);
    this.doorsHint = hud(this.add.text(bx - 170, by + 34, 'TAP = GO\nHOLD = WAIT', textStyle(15, '#ffffff', { fontFamily: UI_FONT, strokeThickness: 4 })).setOrigin(0.5), 104);
    this.doorsBtn.on('pointerdown', (pointer) => this.pressDoors(pointer.id));
    this.doorsUI = [this.doorsRing, this.doorsBtn, this.doorsLabel, this.doorsHint];

    this.banner = hud(this.add.text(W / 2, H / 2 - 40, '', textStyle(56, '#ffd23f', { strokeThickness: 10 })).setOrigin(0.5).setAlpha(0), 110);
    this.subBanner = hud(this.add.text(W / 2, H / 2 + 20, '', textStyle(28, '#ffffff')).setOrigin(0.5).setAlpha(0), 110);
    this.altText = hud(this.add.text(W / 2, 70, '', textStyle(44, '#ffffff', { strokeThickness: 9 })).setOrigin(0.5).setVisible(false), 110);

    this.patienceGfx = this.add.graphics().setDepth(40);

    // pooled floating text
    this.popups = [];
    for (let i = 0; i < 14; i++) {
      this.popups.push(this.add.text(0, 0, '', textStyle(26, '#ffffff')).setOrigin(0.5).setDepth(95).setVisible(false));
    }
    this.popupIndex = 0;
  }

  popup(x, y, str, color, size) {
    const t = this.popups[this.popupIndex];
    this.popupIndex = (this.popupIndex + 1) % this.popups.length;
    this.tweens.killTweensOf(t);
    t.setText(str).setColor(color || '#ffffff').setFontSize((size || 26) + 'px').setPosition(x, y).setAlpha(1).setScale(0.6).setVisible(true);
    this.tweens.add({ targets: t, scale: 1, duration: 140, ease: 'Back.easeOut' });
    this.tweens.add({ targets: t, y: y - 60, alpha: 0, delay: 350, duration: 700, ease: 'Sine.easeIn', onComplete: () => t.setVisible(false) });
  }

  showBanner(main, sub, color, ms) {
    this.tweens.killTweensOf([this.banner, this.subBanner]);
    this.banner.setText(main).setColor(color || '#ffd23f').setAlpha(1).setScale(0.3);
    this.subBanner.setText(sub || '').setAlpha(sub ? 1 : 0).setScale(1);
    this.tweens.add({ targets: this.banner, scale: 1, duration: 320, ease: 'Back.easeOut' });
    this.tweens.add({ targets: [this.banner, this.subBanner], alpha: 0, delay: ms || 1200, duration: 350 });
  }

  updateHUD() {
    const Wc = CONFIG.weight;
    const w = this.state === 'ride' || this.state === 'closing' ? this.closeWeight || this.weight : this.weight;
    const shake = w >= Wc.danger ? rand(-0.05, 0.05) : 0;
    const target = Math.PI * (Math.min(w, Wc.gaugeMax) / Wc.gaugeMax) - Math.PI / 2 + shake;
    this.needle.rotation += (target - this.needle.rotation) * 0.2;

    if (w !== this.shownWeight) {
      this.shownWeight = w;
      const risk = snapChance(w);
      const color = w >= Wc.danger ? '#ff4757' : w > Wc.warn ? '#ffd23f' : '#3ddc84';
      this.loadText.setText(`LOAD ${w}/${Wc.max}`).setColor(color);
      this.riskText.setText(`SNAP RISK ${Math.round(risk * 100)}%`).setColor(color);
      Sound.setIntensity(clamp((w - 3) / (Wc.gaugeMax - 3), 0, 1));
    }

    // auto-close ring around the DOORS button
    const g = this.doorsRing;
    g.clear();
    if (this.state === 'load') {
      const frac = clamp(this.loadTimer / CONFIG.timing.loadMs, 0, 1);
      const bx = CONFIG.width - 110, by = CONFIG.height - 96 - 4;
      g.lineStyle(10, CONFIG.colors.ink, 0.6);
      g.strokeCircle(bx, by, 72);
      g.lineStyle(8, this.holding ? 0x4ea8ff : frac < 0.3 ? CONFIG.colors.red : 0xffffff);
      g.beginPath();
      g.arc(bx, by, 72, -Math.PI / 2, -Math.PI / 2 + TAU * frac, false);
      g.strokePath();
      this.doorsBtn.setTint(this.holding ? 0x9fd3ff : 0xffffff);
      this.doorsLabel.setText(this.holding ? 'HOLDING' : 'DOORS');
    }
  }

  setScore(v) {
    this.score = v;
    this.scoreText.setText(`SCORE ${v}`);
  }

  // ---- input ----------------------------------------------------------------
  setupInput() {
    this.input.addPointer(1);
    this.input.on('pointerdown', (pointer, over) => {
      Sound.unlock();
      if (over.length) return;
      this.startDrag(pointer);
    });
    this.input.on('pointermove', (pointer) => {
      const d = this.drag;
      if (!d || d.pointerId !== pointer.id) return;
      d.constraint.pointA.x = pointer.worldX;
      d.constraint.pointA.y = pointer.worldY;
      if (Math.abs(pointer.worldX - d.startX) + Math.abs(pointer.worldY - d.startY) > 14) d.moved = true;
    });
    const up = (pointer) => {
      if (this.drag && this.drag.pointerId === pointer.id) this.endDrag(true);
      if (this.doorsPress && this.doorsPress.id === pointer.id) this.releaseDoors();
    };
    this.input.on('pointerup', up);
    this.input.on('pointerupoutside', up);
    this.input.keyboard.addCapture('SPACE');
    this.input.keyboard.on('keydown-SPACE', (ev) => { if (!ev.repeat) this.pressDoors('key'); });
    this.input.keyboard.on('keyup-SPACE', () => { if (this.doorsPress && this.doorsPress.id === 'key') this.releaseDoors(); });
  }

  pressDoors(id) {
    Sound.unlock();
    if (this.state !== 'load' || this.doorsPress) return;
    this.doorsPress = { id, t: this.time.now };
    this.doorsBtn.setScale(0.92);
  }

  releaseDoors() {
    const p = this.doorsPress;
    this.doorsPress = null;
    this.doorsBtn.setScale(1);
    const wasHolding = this.holding;
    this.holding = false;
    if (!p || this.state !== 'load') return;
    if (!wasHolding) this.closeDoors();
  }

  canInteract() {
    return this.state === 'load' || this.state === 'deliver' || this.state === 'ride' || this.state === 'closing';
  }

  pickWorker(x, y) {
    const bodies = [];
    for (const w of this.workers) if (w.alive && !w.launched && w.state !== 'leftBehind') for (const b of w.bodies) bodies.push(b);
    const hits = MQuery.point(bodies, { x, y });
    if (hits.length) {
      const b = hits[hits.length - 1];
      return { worker: this.workers.find((w) => w.bodies.includes(b)), body: b };
    }
    // fat-finger fallback for phones: nearest torso within 46 px
    let best = null, bestD = 46 * 46;
    for (const w of this.workers) {
      if (!w.alive || w.launched) continue;
      const dx = w.x - x, dy = w.y - y, d = dx * dx + dy * dy;
      if (d < bestD) { bestD = d; best = w; }
    }
    return best ? { worker: best, body: best.torso.body } : null;
  }

  startDrag(pointer) {
    if (!this.canInteract() || this.drag) return;
    const hit = this.pickWorker(pointer.worldX, pointer.worldY);
    if (!hit || !hit.worker) return;
    const { worker, body } = hit;
    worker.wake();
    const constraint = this.matter.add.worldConstraint(body, 0, CONFIG.physics.dragStiffness, {
      pointA: { x: pointer.worldX, y: pointer.worldY },
      pointB: { x: pointer.worldX - body.position.x, y: pointer.worldY - body.position.y },
      damping: 0.1,
    });
    this.drag = {
      worker, constraint, pointerId: pointer.id, t: this.time.now, startX: pointer.worldX, startY: pointer.worldY,
      moved: false, prevState: worker.state, wasInside: worker.isInsideCar(this.sag),
    };
    worker.state = 'dragged';
    worker.setFace('scream');
    Sound.squish();
  }

  endDrag(applyShove) {
    const d = this.drag;
    if (!d) return;
    this.drag = null;
    if (this.matter.world) this.matter.world.removeConstraint(d.constraint);
    const w = d.worker;
    if (!w.alive || w.launched) return;
    const tap = applyShove && !d.moved && this.time.now - d.t < CONFIG.timing.tapMs + 120;
    const inside = w.isInsideCar(this.sag);
    const L = CONFIG.layout;
    if (tap) {
      // Shove toward the back of the car: harder for managers and bosses to move
      const r = w.type.shoveResist;
      if (inside) w.push(-6 * r, -3 * r);
      else w.push(-11 * r, -6 * r);
      if (w.typeKey === 'manager') this.fx.coffee.emitParticleAt(w.armR.x, w.armR.y, 8);
      Sound.thud(0.3);
    }
    if (this.state === 'deliver' && d.prevState === 'exiting') {
      w.setState('exiting');
    } else if (inside) {
      w.setState('riding');
    } else if (d.wasInside && this.state === 'load') {
      w.setState('leaving');
      w.ghost();
      this.popup(w.x, w.y - 70, 'FINE!', '#ff9f9f', 24);
      Sound.hmph();
    } else if (this.state === 'load' && w.x > L.carRight - 40) {
      w.targetX = rand(L.carLeft + 40, this.carCX);
      w.setState('boarding');
    } else if (this.state === 'deliver') {
      w.setState('exiting');
    } else {
      w.setState(inside ? 'riding' : 'leaving');
      if (!inside) w.ghost();
    }
  }

  // ---- floor flow -------------------------------------------------------------
  beginFloor() {
    const name = CONFIG.floorNames[this.floor - 1] || `LEVEL ${this.floor}`;
    this.floorText.setText(this.ridesSurvived >= CONFIG.floorsPerRun ? `FLOOR ${this.floor} • ${name}` : `FLOOR ${this.floor}/${CONFIG.floorsPerRun} • ${name}`);
    this.indicator.setText(String(this.floor));
    const riders = this.workers.filter((w) => w.alive && w.state === 'riding');
    if (riders.length) this.beginDeliver(riders);
    else if (this.ridesSurvived >= CONFIG.floorsPerRun) this.completeRun();
    else this.beginLoad();
  }

  beginDeliver(riders) {
    this.state = 'deliver';
    this.deliverT = 0;
    this.animateDoor('L', 0);
    for (const w of riders) {
      w.scored = false;
      w.setState('exiting');
      w.setFace('calm');
    }
    if (this.closeWeight >= CONFIG.score.perfectMin && this.closeWeight <= CONFIG.score.perfectMax) {
      const bonus = CONFIG.score.perfectBonus * this.ridesSurvived;
      this.setScore(this.score + bonus);
      this.showBanner('PERFECT PACK!', `+${bonus} bonus`, '#3ddc84', 1300);
      this.fx.confetti.explode(40, this.carCX, CONFIG.layout.carTop + 40);
      Sound.fanfare();
    }
  }

  updateDeliver(dt) {
    const L = CONFIG.layout;
    this.deliverT += dt;
    let pending = 0;
    for (const w of this.workers) {
      if (!w.alive || w.state !== 'exiting') continue;
      if (!w.scored && w.x < L.carLeft - 28) this.scoreDelivery(w);
      if (!w.scored) {
        pending++;
        w.updateStuck(dt, -1);
      } else if (w.x > L.carLeft - 90) {
        pending++; // still close to the door
      }
      if (w.x < L.exitX) w.destroy();
    }
    if (this.deliverT > CONFIG.timing.deliverMaxMs) {
      // Stragglers are helped out with a puff of smoke.
      for (const w of this.workers) {
        if (!w.alive || w.state !== 'exiting') continue;
        if (!w.scored) this.scoreDelivery(w);
        this.fx.puff.explode(6, w.x, w.y);
        w.destroy();
      }
      pending = 0;
    }
    if (pending === 0) {
      this.animateDoor('L', 1);
      if (this.ridesSurvived >= CONFIG.floorsPerRun) this.completeRun();
      else this.beginLoad();
    }
  }

  scoreDelivery(w) {
    w.scored = true;
    const pts = w.type.points * Math.max(1, this.ridesSurvived);
    this.delivered++;
    this.setScore(this.score + pts);
    this.popup(w.x, w.y - 70, `+${pts}`, '#ffd23f', 28);
    Sound.coin();
  }

  beginLoad() {
    const L = CONFIG.layout;
    const Q = CONFIG.queue;
    this.state = 'load';
    this.loadTimer = CONFIG.timing.loadMs;
    this.boardClock = CONFIG.timing.boardDelayMs;
    this.holding = false;
    this.closeWeight = 0;
    this.showBanner(`FLOOR ${this.floor}`, CONFIG.floorNames[this.floor - 1] || '', '#ffd23f', 900);
    Sound.ding();
    this.animateDoor('R', 0);
    this.setDoorsUI(true);

    const alive = this.workers.filter((w) => w.alive).length;
    const n = Math.min(randInt(Q.min, Q.max), CONFIG.workerCap - alive);
    const mix = CONFIG.spawnMix[Math.min(this.floor - 1, CONFIG.spawnMix.length - 1)];
    let x = CONFIG.width + 30; // everyone runs in from just off screen
    for (let i = 0; i < n; i++) {
      const key = TYPE_KEYS[weightedIndex(mix)];
      const w = new Worker(this, key, x + rand(0, 30), L.floorY - 2, { state: 'queue' });
      w.patienceMax = w.patience = rand(Q.patienceMin, Q.patienceMax) + i * 500;
      this.workers.push(w);
      x += 90;
    }
    this.assignSlots();
  }

  // Queue slots are packed by each worker's width
  assignSlots() {
    const L = CONFIG.layout;
    const q = this.workers.filter((w) => w.alive && w.state === 'queue').sort((a, b) => a.x - b.x);
    let x = L.queueStartX;
    for (const w of q) {
      const half = w.type.torso[0] / 2 + w.type.arm[0];
      w.slotX = x + half;
      x += half * 2 + L.queueGap;
    }
  }

  updateLoad(dt) {
    const L = CONFIG.layout;
    if (!this.holding && this.doorsPress && this.time.now - this.doorsPress.t > CONFIG.timing.tapMs) this.holding = true;
    if (!this.holding) this.loadTimer -= dt;

    // board the next worker in line
    this.boardClock -= dt;
    if (this.boardClock <= 0) {
      let front = null;
      for (const w of this.workers) {
        if (w.alive && w.state === 'queue' && w.x < CONFIG.width - 10 && (!front || w.x < front.x)) front = w;
      }
      if (front) {
        front.targetX = rand(L.carLeft + 36, this.carCX + 20);
        front.setState('boarding');
        this.assignSlots();
        this.boardClock = CONFIG.timing.boardIntervalMs;
      } else {
        this.boardClock = 150;
      }
    }

    for (const w of this.workers) {
      if (!w.alive) continue;
      if (w.state === 'queue') {
        w.patience -= dt;
        if (w.patience <= 0) {
          w.setState('leaving');
          this.popup(w.x, w.y - 70, 'HMPH!', '#ff9f9f', 22);
          Sound.hmph();
          this.assignSlots();
        } else if (w.typeKey === 'intern' && Math.random() < dt * 0.0006) {
          w.hop(0.5, 0); // impatient little hops
        }
      } else if (w.state === 'boarding') {
        const inside = w.isInsideCar(this.sag);
        if (inside && (Math.abs(w.x - w.targetX) < 14 || w.stuckT > 380)) w.setState('riding');
        else w.updateStuck(dt, -1);
        if (w.typeKey === 'boss') this.bossBump(w, dt);
      }
    }

    if (this.loadTimer <= 0) this.closeDoors();
  }

  // The Big Boss shoves smaller workers out of his way
  bossBump(boss, dt) {
    boss.bumpCD -= dt;
    if (boss.bumpCD > 0) return;
    boss.bumpCD = 450;
    for (const w of this.workers) {
      if (w === boss || !w.alive || w.launched || w.typeKey === 'boss') continue;
      const dx = w.x - boss.x;
      if (dx < 0 && dx > -80 && Math.abs(w.y - boss.y) < 70) {
        w.push(-2.5, -4.5);
        if (Math.random() < 0.4) this.popup(w.x, w.y - 60, 'OOF', '#ffffff', 18);
      }
    }
  }

  closeDoors() {
    if (this.state !== 'load') return;
    this.state = 'closing';
    this.holding = false;
    this.doorsPress = null;
    this.doorsBtn.setScale(1).clearTint();
    this.setDoorsUI(false);
    this.closeWeight = this.weight;
    let leftBehind = 0;
    for (const w of this.workers) {
      if (!w.alive || w.launched) continue;
      if (w.isInsideCar(this.sag)) {
        if (w.state !== 'dragged') w.setState('riding');
      } else if (w.state !== 'leaving') {
        if (this.drag && this.drag.worker === w) this.endDrag(false);
        w.setState('leaving');
        w.ghost();
        leftBehind++;
      }
    }
    if (leftBehind) {
      this.popup(CONFIG.layout.carRight + 120, CONFIG.layout.floorY - 150, 'HEY!', '#ff9f9f', 26);
      Sound.hmph();
    }
    this.animateDoor('R', 1, () => this.startRide());
  }

  startRide() {
    const L = CONFIG.layout;
    this.state = 'ride';
    this.rideT = 0;
    this.closeWeight = this.weight;
    const p = snapChance(this.closeWeight);
    this.willSnap = Math.random() < p;
    this.snapAt = CONFIG.timing.rideMs * rand(0.35, 0.7);
    for (const w of this.workers) if (w.alive) w.wake();
    this.matter.world.setGravity(0, CONFIG.physics.gravityY * 1.6);
    this.time.delayedCall(260, () => { if (!this.snapped) this.matter.world.setGravity(0, CONFIG.physics.gravityY); });
    Sound.motor(true);
    this.arrow.setAlpha(1);
    this.arrowTween = this.tweens.add({ targets: this.arrow, alpha: 0.2, duration: 250, yoyo: true, repeat: -1 });
    this.rideTween = this.tweens.add({ targets: this.building, y: L.floorHeight, duration: CONFIG.timing.rideMs, ease: 'Sine.easeInOut' });
    this.tweens.add({ targets: this.skyline, y: this.skyline.y + L.floorHeight * 0.1, duration: CONFIG.timing.rideMs, ease: 'Sine.easeInOut' });
    this.indicatorSwitched = false;
  }

  updateRide(dt) {
    this.rideT += dt;
    if (!this.indicatorSwitched && this.rideT > CONFIG.timing.rideMs / 2) {
      this.indicatorSwitched = true;
      this.indicator.setText(String(this.floor + 1));
    }
    if (this.willSnap && this.rideT >= this.snapAt) {
      this.triggerSnap();
      return;
    }
    if (this.rideT >= CONFIG.timing.rideMs) this.arrive();
  }

  arrive() {
    this.state = 'arrive';
    Sound.motor(false);
    Sound.ding();
    if (this.arrowTween) this.arrowTween.stop();
    this.arrow.setAlpha(0);
    this.ridesSurvived++;
    this.floor++;
    this.buildBuilding();
    for (const w of this.workers) if (w.alive) w.wake();
    this.matter.world.setGravity(0, CONFIG.physics.gravityY * 0.45); // passengers float for a moment
    this.time.delayedCall(220, () => {
      if (this.snapped) return;
      this.matter.world.setGravity(0, CONFIG.physics.gravityY);
      this.beginFloor();
    });
  }

  completeRun() {
    this.state = 'complete';
    const bonus = CONFIG.score.completeBonus;
    this.setScore(this.score + bonus);
    this.showBanner('SHIFT COMPLETE!', `+${bonus} survival bonus`, '#3ddc84', 1600);
    this.fx.confetti.explode(80, CONFIG.width / 2, 200);
    this.fx.paper.explode(20, CONFIG.width / 2, 260);
    Sound.fanfare();
    this.time.delayedCall(CONFIG.timing.completeMs, () => this.endRun(false));
  }

  animateDoor(side, to, onDone) {
    const door = side === 'L' ? this.doorL : this.doorR;
    this.tweens.killTweensOf(door);
    this.tweens.add({
      targets: door, p: to, duration: CONFIG.timing.doorMs, ease: 'Sine.easeInOut',
      onComplete: () => { if (to === 1) Sound.thud(0.2); if (onDone) onDone(); },
    });
  }

  setDoorsUI(visible) {
    for (const o of this.doorsUI) o.setVisible(visible);
  }

  // ---- the snap ------------------------------------------------------------
  triggerSnap() {
    const L = CONFIG.layout;
    const Tm = CONFIG.timing;
    this.state = 'flight';
    this.snapped = true;
    this.flightT = 0;
    this.descendT = 0;
    this.resultShown = false;
    if (this.drag) this.endDrag(false);
    if (this.rideTween) this.rideTween.stop();
    if (this.arrowTween) this.arrowTween.stop();
    Sound.motor(false);
    Sound.snap();
    this.time.delayedCall(120, () => Sound.boing());
    this.time.delayedCall(60, () => Sound.scream(Math.min(6, 2 + this.launchedCount)));
    this.time.delayedCall(250, () => Sound.whoosh());
    this.time.delayedCall(900, () => Sound.crash());

    // 1) freeze frame, flash, shake
    this.hitstop = Tm.hitstopFrames;
    this.cameras.main.flash(140, 255, 255, 255);
    this.cameras.main.shake(500, 0.02);

    // 2) blow the ceiling off
    this.matter.world.remove(this.ceiling);
    this.header.setVisible(false);
    this.lamp.setVisible(false);
    this.indicator.setVisible(false);
    this.arrow.setVisible(false);
    this.fx.debris.explode(36, this.carCX, L.carTop + this.sag);
    this.fx.confetti.explode(90, this.carCX, L.carTop + 20);
    this.fx.paper.explode(26, this.carCX, L.carTop + 40);
    this.fx.sparks.explode(30, this.carCX, L.carTop - 150);
    this.showBanner('CABLE SNAPPED!', '', '#ff4757', 900);

    // 3) launch everyone, harder the higher they are in the pile
    this.matter.world.setGravity(0, CONFIG.physics.gravityY);
    const h = L.floorY - L.carTop;
    this.launchRefY = L.carTop;
    this.camTargetY = 0;
    this.launchedCount = 0;
    for (const w of this.workers) {
      if (!w.alive) continue;
      if (w.isInsideCar(this.sag) || w.state === 'riding') {
        const hf = clamp((L.floorY + this.sag - w.y) / h, 0, 1);
        w.launch(hf);
        this.launchedCount++;
      } else {
        w.destroy();
      }
    }

    // 4) slow motion, then ease back to normal speed
    this.setTimeScale(Tm.slowmoScale);
    this.time.delayedCall(Tm.slowmoMs, () => {
      this.tweens.addCounter({
        from: Tm.slowmoScale, to: 1, duration: Tm.slowmoEaseMs, ease: 'Sine.easeIn',
        onUpdate: (tw) => this.setTimeScale(tw.getValue()),
      });
    });

    this.setDoorsUI(false);
    for (const o of this.gaugeGroup) o.setVisible(false);
    this.altText.setVisible(true).setText('ALTITUDE 0 m');
  }

  setTimeScale(s) {
    this.timeScale = s;
    this.matter.world.engine.timing.timeScale = s;
    for (const e of this.emitters) e.timeScale = s;
  }

  updateFlight(dt) {
    this.flightT += dt;
    const W = CONFIG.width;
    const cam = this.cameras.main;

    // the car falls away (in world time, so it respects slow motion)
    const sdt = dt * this.timeScale;
    this.carFallV += CONFIG.launch.carFallGravity * sdt;
    this.carFallY += this.carFallV * sdt;
    this.cableSnapT += sdt;

    let leader = null;
    for (const w of this.workers) {
      if (w.alive && w.launched && (!leader || w.y < leader.y)) leader = w;
    }
    if (!leader) { this.showResult(); return; }

    const alt = Math.max(0, (this.launchRefY - leader.y) / CONFIG.pxPerMeter);
    if (alt > this.flightDistance) this.flightDistance = alt;
    const shown = Math.round(this.flightDistance);
    if (shown !== this.shownAlt) {
      this.shownAlt = shown;
      this.altText.setText(`ALTITUDE ${shown} m`);
    }

    // camera follows (and leads) the highest worker upward, never back down
    const lvy = velY(leader.torso.body);
    this.camTargetY = Math.min(this.camTargetY, leader.y - 300 + Math.min(0, lvy) * 6);
    const follow = 1 - Math.pow(0.8, dt / 16.7); // frame-rate independent smoothing
    cam.scrollY += (this.camTargetY - cam.scrollY) * follow;
    cam.scrollX += (clamp(leader.x - W / 2, -380, 380) - cam.scrollX) * follow * 0.3;

    const camAlt = Math.max(0, -cam.scrollY / CONFIG.pxPerMeter);
    cam.setBackgroundColor(skyColorAt(camAlt));
    this.stars.setAlpha(clamp((camAlt - 180) / 220, 0, 1));
    for (const c of this.clouds) {
      if (c.y > cam.scrollY + CONFIG.height + 120) {
        c.y = cam.scrollY - rand(80, 900);
        c.x = cam.scrollX + rand(-100, W + 100);
      }
    }

    // speed lines scale with upward speed
    const speedA = clamp((-lvy - 6) / 30, 0, 0.75);
    for (const s of this.speedLines) {
      s.setAlpha(speedA);
      s.y += (8 + -lvy * 1.4) * (dt / 16.7);
      if (s.y > CONFIG.height + 80) { s.y = -80; s.x = rand(0, W); }
    }

    // trails and flying coffee
    this.frame++;
    if (this.frame % 2 === 0) {
      for (const w of this.workers) {
        if (!w.alive || !w.launched) continue;
        this.fx.trail.emitParticleAt(w.x, w.y, 1);
        if (w.typeKey === 'manager' && this.frame % 6 === 0) this.fx.coffee.emitParticleAt(w.armR.x, w.armR.y, 2);
      }
    }

    // finish once the leader starts falling back down
    if (lvy > 0.3) this.descendT += dt;
    if (!this.resultShown && (this.descendT > CONFIG.timing.descendMs || this.flightT > CONFIG.timing.flightMaxMs)) this.showResult();
  }

  showResult() {
    if (this.resultShown) return;
    this.resultShown = true;
    const meters = Math.round(this.flightDistance);
    this.flightBonus = meters * CONFIG.score.pointsPerMeter;
    this.setScore(this.score + this.flightBonus);
    this.tweens.killTweensOf([this.banner, this.subBanner]);
    this.banner.setText(`FLIGHT DISTANCE: ${meters} m`).setColor('#ffd23f').setAlpha(1).setScale(2.4);
    this.subBanner.setText(`${this.launchedCount} coworker${this.launchedCount === 1 ? '' : 's'} launched  •  +${this.flightBonus} points`).setAlpha(1);
    this.tweens.add({ targets: this.banner, scale: 1, duration: 420, ease: 'Bounce.easeOut' });
    this.cameras.main.shake(250, 0.01);
    this.fx.confetti.explode(60, this.cameras.main.scrollX + CONFIG.width / 2, this.cameras.main.scrollY + 120);
    Sound.fanfare();
    this.time.delayedCall(CONFIG.timing.resultMs, () => this.endRun(true));
  }

  endRun(snapped) {
    if (this.ended) return;
    this.ended = true;
    Sound.motor(false);
    Sound.setIntensity(0);
    const flight = Math.round(this.flightDistance);
    const coins = Math.floor(this.score / CONFIG.score.pointsPerCoin) + Math.floor(flight / CONFIG.score.metersPerCoin);
    const isBest = this.score > Save.data.best;
    Save.data.coins += coins;
    if (isBest) Save.data.best = this.score;
    Save.write();
    this.tweens.killTweensOf([this.banner, this.subBanner]);
    for (const o of [this.banner, this.subBanner, this.altText]) o.setVisible(false);
    this.scene.launch('GameOver', {
      snapped, score: this.score, best: Save.data.best, isBest, flight, coins, totalCoins: Save.data.coins,
      delivered: this.delivered, launched: this.launchedCount, floors: this.ridesSurvived,
    });
    this.scene.pause();
  }

  // ---- per-frame update -------------------------------------------------------------
  update(time, delta) {
    const dt = Math.min(delta, 50);
    this.stepPhysics(dt);

    // weight and sag
    if (!this.snapped) {
      let w = 0;
      for (const wk of this.workers) {
        if (!wk.alive) continue;
        const inside = wk.isInsideCar(this.sag);
        if (inside) w += wk.type.weight;
        if (this.state === 'load' && inside !== wk.wasInside && wk.state !== 'leaving') {
          const sign = inside ? '+' : '−';
          this.popup(wk.x, wk.y - 80, `${sign}${wk.type.weight}`, inside ? '#ffffff' : '#9fd3ff', 22);
          if (inside) Sound.thud(0.18 + wk.type.weight * 0.05);
        }
        wk.wasInside = inside;
      }
      if (this.state === 'load' || this.state === 'deliver' || this.state === 'intro') this.weight = w;
      const targetSag = CONFIG.layout.maxSag * clamp(this.weight / CONFIG.weight.gaugeMax, 0, 1);
      if (Math.abs(targetSag - this.sag) > 0.05) {
        this.sag += (targetSag - this.sag) * 0.1;
        if (this.frame % 10 === 0) for (const wk of this.workers) if (wk.alive && wk.state === 'riding') wk.wake();
      }
    }

    if (this.state === 'closing') {
      for (const w of this.workers) {
        if (w.alive && w.state === 'riding' && w.x > CONFIG.layout.carRight - 45) {
          for (const b of w.bodies) setVel(b, Math.min(velX(b), -2), velY(b));
        }
      }
    }

    switch (this.state) {
      case 'deliver': this.updateDeliver(dt); break;
      case 'load': this.updateLoad(dt); break;
      case 'ride': this.updateRide(dt); break;
      case 'flight': this.updateFlight(dt); break;
      default: break;
    }

    if (!this.snapped) this.updateTension(dt);
    this.updateFaces(dt);
    this.cleanupWorkers();
    this.updateCarVisuals();
    this.drawCable();
    this.drawPatience();
    if (!this.snapped) this.updateHUD();
    if (!this.snapped) this.frame++;
  }

  stepPhysics(dt) {
    if (this.hitstop > 0) { this.hitstop--; return; }
    const P = CONFIG.physics;
    this.acc += dt;
    let n = 0;
    const maxS = this.snapped ? P.maxSpeedLaunched : P.maxSpeed;
    const maxW = this.snapped ? P.maxAngularLaunched : P.maxAngular;
    while (this.acc >= P.stepMs && n < P.maxStepsPerFrame) {
      if (!this.snapped) this.syncCar(false);
      for (const w of this.workers) if (w.alive) w.physicsStep();
      this.matter.world.step(P.stepMs);
      for (const w of this.workers) if (w.alive) w.clampVelocity(w.launched ? P.maxSpeedLaunched : maxS, w.launched ? P.maxAngularLaunched : maxW);
      this.acc -= P.stepMs;
      n++;
    }
    if (n >= P.maxStepsPerFrame) this.acc = 0; // never spiral after a hitch
  }

  // Creaks, flicker, sparks, shakes, and alarms as the load climbs
  updateTension(dt) {
    const Wc = CONFIG.weight;
    const w = this.state === 'ride' || this.state === 'closing' ? this.closeWeight : this.weight;
    const active = this.state === 'load' || this.state === 'ride' || this.state === 'closing';
    const loudness = this.holding ? 1.5 : 1;

    this.creakCD -= dt;
    if (active && w >= Wc.creakFrom && this.creakCD <= 0) {
      const f = clamp((w - Wc.creakFrom) / (Wc.gaugeMax - Wc.creakFrom), 0, 1);
      Sound.creak(f * loudness);
      this.creakCD = lerp(2200, 350, f) * (this.holding ? 0.6 : 1) * rand(0.8, 1.2);
    }

    // light flicker
    this.flickerT -= dt;
    if (w > Wc.warn && this.flickerT <= 0 && Math.random() < 0.04 * (w - Wc.warn)) this.flickerT = rand(40, 120);
    const dim = this.flickerT > 0;
    this.glow.setAlpha(dim ? 0.02 : 0.18);
    this.lamp.setFillStyle(dim ? 0x6b6650 : 0xfff8d6);

    // sparks at the fraying point and screen shake
    if (active && w >= Wc.danger) {
      this.sparkCD -= dt;
      if (this.sparkCD <= 0) {
        this.sparkCD = rand(120, 320);
        this.fx.sparks.emitParticleAt(this.carCX + rand(-4, 4), this.frayY(), randInt(2, 5));
      }
      this.shakeCD -= dt;
      if (this.shakeCD <= 0) {
        this.shakeCD = 280;
        this.cameras.main.shake(220, 0.002 + 0.0015 * (w - Wc.danger));
      }
      if (this.state === 'load') {
        this.alarmCD -= dt;
        if (this.alarmCD <= 0) { this.alarmCD = 900; Sound.alarm(); }
      }
    }
  }

  frayY() {
    return CONFIG.layout.carTop - 64 - 110 + this.sag;
  }

  drawCable() {
    const L = CONFIG.layout;
    const g = this.cable;
    const x = this.carCX;
    const col = CONFIG.colors.cable;
    const topY = this.pulleyY + this.building.y;
    g.clear();
    if (!this.snapped) {
      const w = this.state === 'ride' || this.state === 'closing' ? this.closeWeight : this.weight;
      const fray = clamp((w - CONFIG.weight.warn + 1) / (CONFIG.weight.gaugeMax - CONFIG.weight.warn + 1), 0, 1);
      const attach = L.carTop - 64 + this.sag;
      const fy = this.frayY();
      const jitter = w >= CONFIG.weight.danger ? rand(-1.5, 1.5) : 0;
      g.lineStyle(7, col);
      g.lineBetween(x, topY, x, fy - 16);
      g.lineBetween(x, fy + 16, x, attach);
      g.lineStyle(Math.max(2, 7 * (1 - fray * 0.7)), col);
      g.lineBetween(x + jitter, fy - 16, x + jitter, fy + 16);
      g.lineStyle(2, 0x8d8da8);
      g.lineBetween(x - 2, topY, x - 2, fy - 16);
      g.lineBetween(x - 2, fy + 16, x - 2, attach);
      const strands = Math.round(fray * this.frayAngles.length);
      g.lineStyle(2, 0x6c6c84);
      for (let i = 0; i < strands; i++) {
        const a = this.frayAngles[i];
        const sy = fy - 10 + i * 4;
        g.lineBetween(x, sy, x + Math.sin(a) * 18 + jitter, sy - Math.cos(a) * 10);
      }
    } else {
      // upper piece whips upward, lower stub falls with the car
      const t = this.cableSnapT;
      const fy = this.frayY();
      const endY = fy - Math.min(900, t * 1.2);
      const amp = 40 * Math.exp(-t / 500);
      g.lineStyle(6, col);
      g.beginPath();
      g.moveTo(x, topY);
      const steps = 16;
      for (let i = 1; i <= steps; i++) {
        const k = i / steps;
        const yy = lerp(topY, endY, k);
        g.lineTo(x + Math.sin(k * 9 + t * 0.03) * amp * k, yy);
      }
      g.strokePath();
      const off = this.sag + this.carFallY;
      g.lineBetween(x, fy + 16 + off, x, L.carTop - 64 + off);
    }
  }

  drawPatience() {
    const g = this.patienceGfx;
    g.clear();
    if (this.state !== 'load') return;
    for (const w of this.workers) {
      if (!w.alive || w.state !== 'queue' || w.x > CONFIG.width) continue;
      const f = clamp(w.patience / w.patienceMax, 0, 1);
      const bx = w.head.x - 20, by = w.head.y - w.type.headR - 16;
      g.fillStyle(CONFIG.colors.ink, 0.85);
      g.fillRect(bx - 2, by - 2, 44, 10);
      g.fillStyle(f > 0.5 ? CONFIG.colors.green : f > 0.25 ? CONFIG.colors.yellow : CONFIG.colors.red);
      g.fillRect(bx, by, 40 * f, 6);
    }
  }

  updateFaces(dt) {
    const crowded = (this.state === 'ride' || this.state === 'closing' ? this.closeWeight : this.weight) > CONFIG.weight.warn;
    for (const w of this.workers) {
      if (!w.alive) continue;
      let face = 'calm';
      if (w.launched || w.state === 'dragged') face = 'scream';
      else if (w.state === 'boarding' || w.state === 'leaving') face = 'worried';
      else if (w.state === 'riding') face = crowded || this.state === 'ride' ? 'worried' : 'calm';
      else if (w.state === 'queue') face = w.patience / w.patienceMax < 0.35 ? 'worried' : 'calm';
      w.setFace(face);
      // managers slosh coffee when they move fast
      if (w.typeKey === 'manager' && !w.launched) {
        w.coffeeCD -= dt;
        const b = w.armR.body;
        if (w.coffeeCD <= 0 && Math.abs(velX(b)) + Math.abs(velY(b)) > 6) {
          w.coffeeCD = 120;
          this.fx.coffee.emitParticleAt(w.armR.x, w.armR.y, 2);
        }
      }
    }
  }

  cleanupWorkers() {
    const W = CONFIG.width;
    for (const w of this.workers) {
      if (!w.alive) continue;
      if (w.state === 'leaving' && w.x > W + 80) w.destroy();
      else if (w.state === 'exiting' && w.scored && w.x < CONFIG.layout.exitX) w.destroy();
      else if (!w.launched && (w.y > CONFIG.height + 400 || w.x < -300 || w.x > W + 900)) w.destroy();
      else if (w.launched && w.y > this.cameras.main.scrollY + CONFIG.height + 1500) w.destroy();
    }
    if (this.drag && !this.drag.worker.alive) this.endDrag(false);
    let j = 0;
    for (let i = 0; i < this.workers.length; i++) if (this.workers[i].alive) this.workers[j++] = this.workers[i];
    this.workers.length = j;
  }
}

// =====================================================================
//  Game over overlay
// =====================================================================
class GameOverScene extends Phaser.Scene {
  constructor() { super('GameOver'); }

  create(data) {
    const W = CONFIG.width, H = CONFIG.height;
    this.data_ = data;
    this.add.rectangle(W / 2, H / 2, W, H, 0x0b0820, 0.62);
    const g = this.add.graphics();
    g.fillStyle(CONFIG.colors.ink); g.fillRoundedRect(W / 2 - 330, 60, 660, 600, 30);
    g.fillStyle(0x2d2850); g.fillRoundedRect(W / 2 - 320, 70, 640, 580, 26);

    const title = data.snapped ? 'CABLE SNAPPED!' : 'SHIFT COMPLETE!';
    const t = this.add.text(W / 2, 128, title, textStyle(52, data.snapped ? '#ff4757' : '#3ddc84', { strokeThickness: 10 })).setOrigin(0.5).setScale(0.3);
    this.tweens.add({ targets: t, scale: 1, duration: 450, ease: 'Back.easeOut' });

    const scoreText = this.add.text(W / 2, 214, 'SCORE 0', textStyle(48, '#ffffff')).setOrigin(0.5);
    this.tweens.addCounter({
      from: 0, to: data.score, duration: 900, ease: 'Cubic.easeOut',
      onUpdate: (tw) => scoreText.setText(`SCORE ${Math.round(tw.getValue())}`),
    });
    if (data.isBest && data.score > 0) {
      const badge = this.add.text(W / 2 + 230, 180, 'NEW BEST!', textStyle(22, '#ffd23f')).setOrigin(0.5).setAngle(12);
      this.tweens.add({ targets: badge, scale: 1.15, duration: 400, yoyo: true, repeat: -1 });
    }

    const lines = [
      `Best: ${data.best}`,
      data.snapped ? `Flight distance: ${data.flight} m` : `Floors survived: ${data.floors}/${CONFIG.floorsPerRun}`,
      `Delivered: ${data.delivered}   •   Launched: ${data.launched}`,
    ];
    this.add.text(W / 2, 300, lines.join('\n'), textStyle(26, '#ffffff', { fontFamily: UI_FONT, lineSpacing: 10 })).setOrigin(0.5, 0);
    this.add.image(W / 2 - 110, 452, 'coin');
    this.add.text(W / 2 - 88, 436, `+${data.coins} coins  (total ${data.totalCoins})`, textStyle(24, '#ffd23f', { align: 'left' }));

    makeButton(this, W / 2, 530, 300, 84, 'PLAY AGAIN', 0x2ecc71, () => this.playAgain(), 34);
    makeButton(this, W / 2 - 160, 614, 200, 60, 'SHARE', 0x4ea8ff, () => this.share(), 24);
    makeButton(this, W / 2 + 160, 614, 200, 60, 'MENU', 0xff4f81, () => this.toMenu(), 24);
    this.toast = this.add.text(W / 2, 684, '', textStyle(18, '#ffffff', { fontFamily: UI_FONT, wordWrap: { width: 900 } })).setOrigin(0.5);

    this.input.keyboard.addCapture('SPACE');
    this.input.keyboard.once('keydown-SPACE', () => this.playAgain());
  }

  playAgain() {
    this.scene.stop('Game');
    this.scene.start('Game');
  }

  toMenu() {
    this.scene.stop('Game');
    this.scene.start('Menu');
  }

  share() {
    const d = this.data_;
    const text = d.snapped
      ? `I launched ${d.launched} coworker${d.launched === 1 ? '' : 's'} ${d.flight}m into orbit in Ragdoll Elevator Rush! Score: ${d.score}. Can you beat me?`
      : `I survived all ${d.floors} floors of Ragdoll Elevator Rush with ${d.score} points. Can you beat me?`;
    const done = (ok) => this.toast.setText(ok ? 'Copied to clipboard!' : text);
    try {
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(() => done(true), () => done(fallbackCopy(text)));
      } else {
        done(fallbackCopy(text));
      }
    } catch (e) {
      done(false);
    }
  }
}

function fallbackCopy(text) {
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch (e) {
    return false;
  }
}

// =====================================================================
//  Boot the game
// =====================================================================
Save.load();
Sound.muted = Save.data.muted;

const game = new Phaser.Game({
  type: Phaser.AUTO,
  parent: 'game',
  backgroundColor: '#1a1536',
  scale: {
    mode: Phaser.Scale.FIT,
    autoCenter: Phaser.Scale.CENTER_BOTH,
    width: CONFIG.width,
    height: CONFIG.height,
  },
  render: { antialias: true, roundPixels: false },
  // Raw frame deltas: Phaser's smoothing clamps delta to 16 ms whenever the page lacks focus
  // (e.g. an unfocused iframe), which would run the whole game in slow motion.
  fps: { smoothStep: false },
  input: { activePointers: 3 },
  disableContextMenu: true,
  scene: [BootScene, MenuScene, GameScene, GameOverScene],
});

// Pause audio with the tab; Phaser pauses the game loop itself.
game.events.on(Phaser.Core.Events.HIDDEN, () => Sound.suspend());
game.events.on(Phaser.Core.Events.VISIBLE, () => Sound.resume());

// First gesture anywhere unlocks audio; block pinch zoom and long-press menus.
const unlockOnce = () => Sound.unlock();
window.addEventListener('pointerdown', unlockOnce, { passive: true });
window.addEventListener('keydown', unlockOnce);
document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('contextmenu', (e) => e.preventDefault());
document.addEventListener('touchmove', (e) => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });

if (DEBUG) {
  window.RER = { game, CONFIG, Save, Sound };
}
})();
</script>
