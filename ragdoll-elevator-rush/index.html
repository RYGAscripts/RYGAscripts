const TYPE_KEYS = ['intern', 'manager', 'boss'];
const FACES = ['calm', 'worried', 'scream'];
const CAT = { WORLD: 0x0001, DOOR: 0x0002, BODY: 0x0004, LIMB: 0x0008 };
const FONT = '"Arial Black", "Segoe UI Black", "Helvetica Neue", Arial, sans-serif';
const UI_FONT = '"Trebuchet MS", "Segoe UI", system-ui, sans-serif';
const TAU = Math.PI * 2;
const DEBUG = /[?&]debug=1/.test(location.search);          // exposes window.RER for testing
const PHYSICS_DEBUG = /[?&]physics=1/.test(location.search); // draws Matter bodies

// =====================================================================
//  Small helpers
// =====================================================================
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);

function weightedIndex(weights) {
  let total = 0;
  for (let i = 0; i < weights.length; i++) total += weights[i];
  let r = Math.random() * total;
  for (let i = 0; i < weights.length; i++) {
    r -= weights[i];
    if (r <= 0) return i;
  }
  return weights.length - 1;
}

function snapChance(weight) {
  if (weight <= CONFIG.weight.warn) return 0;
  const table = CONFIG.weight.snapChance;
  let p = 0;
  for (const key of Object.keys(table)) {
    if (weight >= Number(key)) p = Math.max(p, table[key]);
  }
  return p;
}

function skinById(id) {
  return CONFIG.skins.find((s) => s.id === id) || CONFIG.skins[0];
}

function lerpColor(a, b, t) {
  const ar = (a >> 16) & 255, ag = (a >> 8) & 255, ab = a & 255;
  const br = (b >> 16) & 255, bg = (b >> 8) & 255, bb = b & 255;
  return (Math.round(lerp(ar, br, t)) << 16) | (Math.round(lerp(ag, bg, t)) << 8) | Math.round(lerp(ab, bb, t));
}

function skyColorAt(meters) {
  const stops = CONFIG.colors.skyStops;
  if (meters <= stops[0][0]) return stops[0][1];
  for (let i = 1; i < stops.length; i++) {
    if (meters <= stops[i][0]) {
      const t = (meters - stops[i - 1][0]) / (stops[i][0] - stops[i - 1][0]);
      return lerpColor(stops[i - 1][1], stops[i][1], t);
    }
  }
  return stops[stops.length - 1][1];
}

function textStyle(size, color, extra) {
  return Object.assign({
    fontFamily: FONT,
    fontSize: size + 'px',
    color: color || '#ffffff',
    stroke: CONFIG.colors.inkCss,
    strokeThickness: Math.max(3, Math.round(size / 7)),
    align: 'center',
  }, extra || {});
}

// Matter.js access (Phaser bundles Matter 0.19)
const M = Phaser.Physics.Matter.Matter;
const MBody = M.Body;
const MSleeping = M.Sleeping;
const MQuery = M.Query;
const BASE_DT = MBody._baseDelta || 1000 / 60;
const V = { x: 0, y: 0 }; // scratch vector: no per-step allocations

// Velocities in px per 1/60 s, independent of the current time scale
function velX(b) { return (b.position.x - b.positionPrev.x) * (BASE_DT / b.deltaTime); }
function velY(b) { return (b.position.y - b.positionPrev.y) * (BASE_DT / b.deltaTime); }
function angVel(b) { return (b.angle - b.anglePrev) * (BASE_DT / b.deltaTime); }
function setVel(b, x, y) { V.x = x; V.y = y; MBody.setVelocity(b, V); }
function setPos(b, x, y) { V.x = x; V.y = y; MBody.setPosition(b, V); }
function wrapAngle(a) {
  a %= TAU;
  if (a > Math.PI) a -= TAU;
  else if (a < -Math.PI) a += TAU;
  return a;
}
// Rotate a body part of the way back to upright and calm its spin
function uprightStep(b, k) {
  const a = wrapAngle(b.angle);
  if (Math.abs(a) > 0.01) MBody.setAngle(b, b.angle - a * k);
  MBody.setAngularVelocity(b, angVel(b) * 0.5);
}

// =====================================================================
//  Save: localStorage wrapped so blocked storage never breaks the game
// =====================================================================
const Save = {
  KEY: 'ragdoll-elevator-rush:v1',
  data: { best: 0, coins: 0, owned: ['classic'], skin: 'classic', muted: false },

  load() {
    try {
      const raw = window.localStorage.getItem(this.KEY);
      if (!raw) return;
      const d = JSON.parse(raw);
      if (!d || typeof d !== 'object') return;
      if (Number.isFinite(d.best)) this.data.best = Math.max(0, Math.floor(d.best));
      if (Number.isFinite(d.coins)) this.data.coins = Math.max(0, Math.floor(d.coins));
      if (Array.isArray(d.owned)) {
        const valid = d.owned.filter((id) => CONFIG.skins.some((s) => s.id === id));
        this.data.owned = Array.from(new Set(['classic'].concat(valid)));
      }
      if (typeof d.skin === 'string' && this.data.owned.includes(d.skin)) this.data.skin = d.skin;
      this.data.muted = !!d.muted;
    } catch (e) {
      // Storage blocked or corrupt: keep defaults.
    }
  },

  write() {
    try {
      window.localStorage.setItem(this.KEY, JSON.stringify(this.data));
    } catch (e) {
      // Storage blocked: progress lasts for this session only.
    }
  },
};

// =====================================================================
//  Audio: everything synthesized with the Web Audio API
// =====================================================================
const MUSIC = {
  // ii-V-I-VI in C, one bar each, eight swung eighths per bar
  bass: [[38, 41, 45, 44], [43, 41, 38, 37], [36, 40, 43, 34], [33, 37, 40, 39]],
  chords: [[53, 57, 60, 64], [53, 59, 62, 64], [52, 55, 59, 62], [55, 61, 64, 65]],
  melody: [
    [74, 0, 72, 69, 0, 0, 65, 0],
    [67, 0, 71, 0, 74, 72, 0, 0],
    [71, 0, 67, 0, 64, 0, 0, 67],
    [69, 73, 0, 76, 0, 73, 70, 0],
  ],
};

const Sound = {
  ctx: null,
  out: null,
  sfxBus: null,
  musicBus: null,
  noise: null,
  unlocked: false,
  muted: false,
  intensity: 0,
  targetIntensity: 0,
  timer: null,
  nextTime: 0,
  eighth: 0,

  // Must be called from a user gesture (browser autoplay rules).
  unlock() {
    if (this.unlocked) { this.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { this.ctx = new AC(); } catch (e) { return; }
    const ctx = this.ctx;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14;
    comp.knee.value = 12;
    comp.ratio.value = 6;
    comp.attack.value = 0.003;
    comp.release.value = 0.2;
    comp.connect(ctx.destination);
    this.out = ctx.createGain();
    this.out.gain.value = this.muted ? 0 : CONFIG.audio.master;
    this.out.connect(comp);
    this.sfxBus = ctx.createGain();
    this.sfxBus.gain.value = CONFIG.audio.sfx;
    this.sfxBus.connect(this.out);
    this.musicBus = ctx.createGain();
    this.musicBus.gain.value = CONFIG.audio.music;
    this.musicBus.connect(this.out);
    const len = ctx.sampleRate;
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    this.noise = buf;
    this.unlocked = true;
    this.resume();
    this.startMusic();
  },

  resume() {
    if (this.ctx && this.ctx.state === 'suspended' && !document.hidden) this.ctx.resume().catch(() => {});
  },

  suspend() {
    if (this.ctx && this.ctx.state === 'running') this.ctx.suspend().catch(() => {});
  },

  setMuted(m) {
    this.muted = m;
    if (this.out) this.out.gain.setTargetAtTime(m ? 0 : CONFIG.audio.master, this.ctx.currentTime, 0.03);
  },

  ok() { return this.unlocked && !this.muted; },

  env(gain, t, attack, peak, decay) {
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(peak, t + attack);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay);
  },

  osc(type, freq, t, dur, peak, o) {
    o = o || {};
    const ctx = this.ctx;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + (o.glide || dur));
    if (o.detune) osc.detune.value = o.detune;
    const a = o.a || 0.005;
    this.env(g, t, a, peak, dur);
    osc.connect(g);
    let last = g;
    if (o.filter) {
      const f = ctx.createBiquadFilter();
      f.type = o.filter;
      f.frequency.value = o.ff || 1000;
      f.Q.value = o.q || 1;
      g.connect(f);
      last = f;
    }
    last.connect(o.dest || this.sfxBus);
    osc.start(t);
    osc.stop(t + a + dur + 0.05);
  },

  noiseBurst(t, dur, peak, o) {
    o = o || {};
    const ctx = this.ctx;
    const src = ctx.createBufferSource();
    src.buffer = this.noise;
    src.loop = true;
    const f = ctx.createBiquadFilter();
    f.type = o.type || 'bandpass';
    f.frequency.setValueAtTime(o.f || 1000, t);
    if (o.to) f.frequency.exponentialRampToValueAtTime(o.to, t + dur);
    f.Q.value = o.q || 1;
    const g = ctx.createGain();
    this.env(g, t, o.a || 0.003, peak, dur);
    src.connect(f);
    f.connect(g);
    g.connect(o.dest || this.sfxBus);
    src.start(t, Math.random() * 0.5);
    src.stop(t + (o.a || 0.003) + dur + 0.05);
  },

  // ---- sound effects -------------------------------------------------
  ding() {
    if (!this.ok()) return;
    const t = this.ctx.currentTime;
    this.osc('sine', 1318.5, t, 1.3, 0.3);
    this.osc('sine', 2637, t, 0.5, 0.05);
    this.osc('sine', 1046.5, t + 0.22, 1.5, 0.3);
    this.osc('sine', 2093, t + 0.22, 0.5, 0.05);
  },

  creak(intensity) {
    if (!this.ok()) return;
    const ctx = this.ctx, t = ctx.currentTime;
    const dur = rand(0.3, 0.7);
    const vol = 0.08 + 0.3 * clamp(intensity, 0, 1.5);
    const osc = ctx.createOscillator();
    osc.type = 'sawtooth';
    const f0 = rand(22, 40);
    osc.frequency.setValueAtTime(f0, t);
    osc.frequency.linearRampToValueAtTime(f0 * rand(1.4, 2.2), t + dur * 0.6);
    osc.frequency.linearRampToValueAtTime(f0 * rand(0.8, 1.2), t + dur);
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = rand(450, 1100);
    bp.Q.value = 7;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.06);
    g.gain.setValueAtTime(vol, t + dur * 0.7);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(bp);
    bp.connect(g);
    g.connect(this.sfxBus);
    osc.start(t);
    osc.stop(t + dur + 0.05);
  },

  squish() {
    if (!this.ok()) return;
    const t = this.ctx.currentTime;
    this.osc('sine', 260, t, 0.16, 0.22, { to: 70 });
    this.noiseBurst(t, 0.12, 0.1, { type: 'lowpass', f: 900, to: 200 });
  },

  thud(v) {
    if (!this.ok()) return;
    v = v || 0.25;
    const t = this.ctx.currentTime;
    this.osc('sine', 140, t, 0.12, v, { to: 50 });
    this.noiseBurst(t, 0.06, v * 0.4, { type: 'lowpass', f: 500 });
  },

  snap() {
    if (!this.ok()) return;
    const t = this.ctx.currentTime;
    this.noiseBurst(t, 0.2, 0.9, { type: 'highpass', f: 1800, a: 0.001 });
    this.osc('square', 1400, t, 0.06, 0.3, { to: 300 });
    this.osc('sawtooth', 220, t + 0.01, 0.6, 0.5, { to: 30, filter: 'lowpass', ff: 1400 });
    this.osc('sine', 90, t, 0.8, 0.7, { to: 28 });
    this.osc('square', 620, t + 0.03, 0.3, 0.1);
    this.osc('square', 870, t + 0.03, 0.25, 0.08);
  },

  boing() {
    if (!this.ok()) return;
    const ctx = this.ctx, t = ctx.currentTime;
    const osc = ctx.createOscillator();
    const lfo = ctx.createOscillator();
    const lfoGain = ctx.createGain();
    const g = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(120, t);
    osc.frequency.exponentialRampToValueAtTime(420, t + 0.5);
    lfo.frequency.value = 16;
    lfoGain.gain.setValueAtTime(70, t);
    lfoGain.gain.exponentialRampToValueAtTime(1, t + 0.7);
    lfo.connect(lfoGain);
    lfoGain.connect(osc.frequency);
    this.env(g, t, 0.01, 0.5, 0.75);
    osc.connect(g);
    g.connect(this.sfxBus);
    osc.start(t);
    lfo.start(t);
    osc.stop(t + 0.85);
    lfo.stop(t + 0.85);
  },

  scream(voices) {
    if (!this.ok()) return;
    const ctx = this.ctx, t = ctx.currentTime;
    for (let i = 0; i < voices; i++) {
      const st = t + rand(0, 0.15);
      const dur = rand(1.1, 1.7);
      const base = rand(260, 480);
      const osc = ctx.createOscillator();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(base, st);
      osc.frequency.linearRampToValueAtTime(base * 1.35, st + 0.25);
      osc.frequency.linearRampToValueAtTime(base * 0.75, st + dur);
      const vib = ctx.createOscillator();
      const vibGain = ctx.createGain();
      vib.frequency.value = rand(5, 8);
      vibGain.gain.value = base * 0.04;
      vib.connect(vibGain);
      vibGain.connect(osc.frequency);
      const f1 = ctx.createBiquadFilter();
      f1.type = 'bandpass'; f1.frequency.value = 850; f1.Q.value = 4;
      const f2 = ctx.createBiquadFilter();
      f2.type = 'bandpass'; f2.frequency.value = 1250; f2.Q.value = 5;
      const g = ctx.createGain();
      this.env(g, st, 0.08, 0.22, dur);
      osc.connect(f1); osc.connect(f2);
      f1.connect(g); f2.connect(g);
      g.connect(this.sfxBus);
      osc.start(st); vib.start(st);
      osc.stop(st + dur + 0.15); vib.stop(st + dur + 0.15);
    }
  },

  coin() {
    if (!this.ok()) return;
    const t = this.ctx.currentTime;
    this.osc('square', 988, t, 0.07, 0.1);
    this.osc('square', 1319, t + 0.07, 0.18, 0.1);
  },

  pop() {
    if (!this.ok()) return;
    this.osc('sine', 520, this.ctx.currentTime, 0.08, 0.2, { to: 900 });
  },

  alarm() {
    if (!this.ok()) return;
    const t = this.ctx.currentTime;
    this.osc('square', 880, t, 0.08, 0.06);
    this.osc('square', 880, t + 0.14, 0.08, 0.06);
  },

  hmph() {
    if (!this.ok()) return;
    this.osc('sawtooth', 150, this.ctx.currentTime, 0.25, 0.12, { to: 95, filter: 'lowpass', ff: 700 });
  },

  whoosh() {
    if (!this.ok()) return;
    this.noiseBurst(this.ctx.currentTime, 0.9, 0.3, { type: 'bandpass', f: 300, to: 2400, q: 1.2, a: 0.2 });
  },

  crash() {
    if (!this.ok()) return;
    const t = this.ctx.currentTime;
    this.noiseBurst(t, 0.7, 0.5, { type: 'lowpass', f: 1600, to: 200 });
    this.osc('sine', 70, t, 0.6, 0.5, { to: 30 });
  },

  fanfare() {
    if (!this.ok()) return;
    const t = this.ctx.currentTime;
    const notes = [523, 659, 784, 1047];
    for (let i = 0; i < notes.length; i++) this.osc('triangle', notes[i], t + i * 0.09, 0.35, 0.16);
  },

  motor(on) {
    if (!this.unlocked) return;
    const ctx = this.ctx, t = ctx.currentTime;
    if (on && !this.motorNodes) {
      const osc = ctx.createOscillator();
      const lp = ctx.createBiquadFilter();
      const g = ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.value = 55;
      lp.type = 'lowpass';
      lp.frequency.value = 220;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.12, t + 0.3);
      osc.connect(lp); lp.connect(g); g.connect(this.sfxBus);
      osc.start(t);
      this.motorNodes = { osc, g };
    } else if (!on && this.motorNodes) {
      const n = this.motorNodes;
      n.g.gain.setTargetAtTime(0.0001, t, 0.08);
      n.osc.stop(t + 0.5);
      this.motorNodes = null;
    }
  },

  // ---- music: a cheesy swung elevator tune -----------------------------
  setIntensity(v) { this.targetIntensity = clamp(v, 0, 1); },

  startMusic() {
    if (this.timer || !this.ctx) return;
    this.nextTime = this.ctx.currentTime + 0.1;
    this.eighth = 0;
    this.timer = setInterval(() => this.scheduleMusic(), 25);
  },

  scheduleMusic() {
    if (!this.ctx || this.ctx.state !== 'running') return;
    const now = this.ctx.currentTime;
    if (this.nextTime < now - 0.25) this.nextTime = now + 0.05; // recover after a stall
    this.intensity += (this.targetIntensity - this.intensity) * 0.06;
    while (this.nextTime < now + 0.12) {
      if (!this.muted) this.playEighth(this.eighth, this.nextTime);
      const beat = 60 / lerp(CONFIG.audio.tempoMin, CONFIG.audio.tempoMax, this.intensity);
      this.nextTime += beat * (this.eighth % 2 === 0 ? 0.62 : 0.38);
      this.eighth = (this.eighth + 1) % 32;
    }
  },

  playEighth(i, t) {
    const bar = (i >> 3) & 3;
    const e = i & 7;
    const bus = this.musicBus;
    const wobble = Math.sin(t * 7) * this.intensity * 30; // tape warble when stressed
    if ((e & 1) === 0) {
      this.osc('triangle', mtof(MUSIC.bass[bar][e >> 1]), t, 0.3, 0.5, { dest: bus, detune: wobble });
    }
    if (e === 2 || e === 5) {
      const chord = MUSIC.chords[bar];
      for (let k = 0; k < chord.length; k++) {
        this.osc('sine', mtof(chord[k]), t, 0.34, 0.055, { dest: bus, detune: wobble, a: 0.01 });
      }
    }
    const note = MUSIC.melody[bar][e];
    if (note) {
      this.osc('sine', mtof(note), t, 0.5, 0.15, { dest: bus, detune: wobble });
      this.osc('sine', mtof(note) * 4, t, 0.12, 0.025, { dest: bus });
    }
    if (e === 2 || e === 6) {
      this.noiseBurst(t, 0.09, 0.07, { type: 'highpass', f: 6000, dest: bus });
    } else if (this.intensity > 0.35) {
      this.noiseBurst(t, 0.04, 0.02 + this.intensity * 0.05, { type: 'highpass', f: 7000, dest: bus });
    }
  },
};

function makeTex(scene, key, w, h, draw) {
  if (scene.textures.exists(key)) return;
  const g = scene.make.graphics({ x: 0, y: 0, add: false });
  draw(g, w, h);
  g.generateTexture(key, w, h);
  g.destroy();
}

function drawHead(g, typeKey, t, skin, face) {
  const r = t.headR;
  const pad = Math.ceil(r * 0.6);
  const c = r + pad;
  const ink = CONFIG.colors.ink;
  const lw = Math.max(2, r * 0.14);

  g.fillStyle(skin);
  g.fillCircle(c, c, r);
  g.lineStyle(lw, ink);
  g.strokeCircle(c, c, r);

  // hair and hats
  if (typeKey === 'intern') {
    g.fillStyle(t.accent);
    g.slice(c, c - r * 0.2, r * 0.98, Math.PI, TAU, false);
    g.fillPath();
    g.fillRoundedRect(c - r * 1.55, c - r * 0.36, r * 0.8, r * 0.26, r * 0.1); // backwards brim
    g.lineStyle(lw * 0.8, ink);
    g.beginPath();
    g.arc(c, c - r * 0.2, r * 0.98, Math.PI, TAU, false);
    g.closePath();
    g.strokePath();
    g.fillStyle(0xffffff);
    g.fillCircle(c, c - r * 1.15, r * 0.14);
  } else if (typeKey === 'manager') {
    g.fillStyle(0x5b3a1e);
    g.fillEllipse(c + r * 0.1, c - r * 0.78, r * 1.85, r * 0.8);
    g.lineStyle(2, 0x3a2412);
    g.lineBetween(c - r * 0.3, c - r * 1.1, c - r * 0.15, c - r * 0.5);
  } else {
    g.fillStyle(0xffffff, 0.45);
    g.fillEllipse(c - r * 0.35, c - r * 0.55, r * 0.55, r * 0.3); // bald shine
    g.fillStyle(0x8f8f9e);
    g.fillEllipse(c - r * 0.95, c - r * 0.05, r * 0.35, r * 0.7);
    g.fillEllipse(c + r * 0.95, c - r * 0.05, r * 0.35, r * 0.7);
  }

  const ex = r * 0.36;
  const ey = c - r * 0.08;

  if (face === 'calm') {
    g.fillStyle(ink);
    g.fillCircle(c - ex, ey, r * 0.12);
    g.fillCircle(c + ex, ey, r * 0.12);
    g.lineStyle(lw * 0.9, ink);
    g.beginPath();
    g.arc(c, c + r * 0.12, r * 0.38, Math.PI * 0.18, Math.PI * 0.82, false);
    g.strokePath();
  } else if (face === 'worried') {
    g.fillStyle(ink);
    g.fillCircle(c - ex, ey, r * 0.11);
    g.fillCircle(c + ex, ey, r * 0.11);
    g.lineStyle(lw * 0.8, ink);
    g.lineBetween(c - ex - r * 0.2, ey - r * 0.22, c - ex + r * 0.18, ey - r * 0.38);
    g.lineBetween(c + ex + r * 0.2, ey - r * 0.22, c + ex - r * 0.18, ey - r * 0.38);
    g.beginPath();
    g.arc(c, c + r * 0.62, r * 0.3, Math.PI * 1.2, Math.PI * 1.8, false);
    g.strokePath();
    g.fillStyle(0x7fd4ff);
    g.fillCircle(c + r * 0.8, c - r * 0.25, r * 0.16);
    g.fillTriangle(c + r * 0.66, c - r * 0.28, c + r * 0.94, c - r * 0.28, c + r * 0.8, c - r * 0.55);
  } else {
    g.fillStyle(0xffffff);
    g.fillCircle(c - ex, ey, r * 0.22);
    g.fillCircle(c + ex, ey, r * 0.22);
    g.lineStyle(lw * 0.6, ink);
    g.strokeCircle(c - ex, ey, r * 0.22);
    g.strokeCircle(c + ex, ey, r * 0.22);
    g.fillStyle(ink);
    g.fillCircle(c - ex, ey, r * 0.08);
    g.fillCircle(c + ex, ey, r * 0.08);
    g.lineStyle(lw * 0.8, ink);
    g.lineBetween(c - ex - r * 0.2, ey - r * 0.42, c - ex + r * 0.18, ey - r * 0.36);
    g.lineBetween(c + ex + r * 0.2, ey - r * 0.42, c + ex - r * 0.18, ey - r * 0.36);
    g.fillStyle(0x5a1020);
    g.fillEllipse(c, c + r * 0.45, r * 0.62, r * 0.66);
    g.lineStyle(lw * 0.7, ink);
    g.strokeEllipse(c, c + r * 0.45, r * 0.62, r * 0.66);
    g.fillStyle(0xff7b8f);
    g.fillEllipse(c, c + r * 0.62, r * 0.36, r * 0.2);
  }

  if (typeKey === 'manager') {
    g.lineStyle(2, ink);
    g.strokeCircle(c - ex, ey, r * 0.26);
    g.strokeCircle(c + ex, ey, r * 0.26);
    g.lineBetween(c - ex + r * 0.26, ey, c + ex - r * 0.26, ey);
  }
  if (typeKey === 'boss') {
    const my = face === 'scream' ? c + r * 0.12 : c + r * 0.3;
    g.fillStyle(0x6e6e7e);
    g.fillEllipse(c - r * 0.22, my, r * 0.5, r * 0.26);
    g.fillEllipse(c + r * 0.22, my, r * 0.5, r * 0.26);
  }
}

  g.lineStyle(2.5, ink);

function drawFloorTile(g, W, H) {
  const L = CONFIG.layout;
  const C = CONFIG.colors;
  const sL = L.carLeft - L.wall - 16;
  const sR = L.carRight + L.wall + 16;
  const slab = L.slabTop;
  const winTop = 70, winBot = 250;
  const windows = [[40, 190], [250, 400], [890, 1040], [1100, 1250]];

  // walls with window gaps, left lobby then right lobby
  g.fillStyle(C.wall);
  g.fillRect(0, 0, sL, winTop);
  g.fillRect(sR, 0, W - sR, winTop);
  g.fillRect(0, winBot, sL, slab - winBot);
  g.fillRect(sR, winBot, W - sR, slab - winBot);
  const lobbies = [[0, sL], [sR, W]];
  for (const [a, b] of lobbies) {
    let x = a;
    for (const [w0, w1] of windows) {
      if (w0 >= a && w1 <= b) {
        g.fillRect(x, winTop, w0 - x, winBot - winTop);
        x = w1;
      }
    }
    g.fillRect(x, winTop, b - x, winBot - winTop);
  }
  // subtle wallpaper stripes
  g.fillStyle(0xffffff, 0.18);
  for (let x = 0; x < W; x += 36) {
    if (x > sL - 8 && x < sR) continue;
    g.fillRect(x, 0, 12, winTop);
    g.fillRect(x, winBot, 12, 30);
  }
  // wainscot
  g.fillStyle(C.wainscot);
  g.fillRect(0, 280, sL, slab - 280);
  g.fillRect(sR, 280, W - sR, slab - 280);
  g.fillStyle(C.baseboard);
  g.fillRect(0, 276, sL, 5);
  g.fillRect(sR, 276, W - sR, 5);
  g.fillRect(0, slab - 10, sL, 10);
  g.fillRect(sR, slab - 10, W - sR, 10);
  // window frames
  for (const [w0, w1] of windows) {
    g.lineStyle(8, C.windowFrame);
    g.strokeRect(w0, winTop, w1 - w0, winBot - winTop);
    g.lineStyle(4, C.windowFrame);
    g.lineBetween((w0 + w1) / 2, winTop, (w0 + w1) / 2, winBot);
    g.lineBetween(w0, (winTop + winBot) / 2, w1, (winTop + winBot) / 2);
    g.fillStyle(0xffffff, 0.12);
    g.fillTriangle(w0 + 6, winTop + 6, w0 + 50, winTop + 6, w0 + 6, winTop + 60);
  }
  // ceiling lights
  g.fillStyle(0xfff4c9);
  g.fillRect(80, 6, 120, 8);
  g.fillRect(260, 6, 120, 8);
  g.fillRect(900, 6, 120, 8);
  g.fillRect(1080, 6, 120, 8);
  // wall clock (left) and water cooler (right)
  g.fillStyle(0xffffff);
  g.fillCircle(420 - 70, 38, 20);
  g.lineStyle(4, C.ink);
  g.strokeCircle(420 - 70, 38, 20);
  g.lineBetween(350, 38, 350, 24);
  g.lineBetween(350, 38, 360, 42);
  g.fillStyle(0xdfe8f5);
  g.fillRect(1236, slab - 70, 30, 60);
  g.fillStyle(0x8fd4ff);
  g.fillRoundedRect(1238, slab - 110, 26, 42, 8);
  g.lineStyle(3, C.ink);
  g.strokeRect(1236, slab - 70, 30, 60);
  // potted plant near the exit
  g.fillStyle(0xc0633b);
  g.fillRect(24, slab - 44, 34, 34);
  g.fillStyle(0x2f9e44);
  g.fillEllipse(41, slab - 62, 50, 36);
  g.fillEllipse(30, slab - 82, 22, 36);
  g.fillEllipse(52, slab - 84, 22, 40);
  // shaft door frames
  g.fillStyle(0x9aa0b5);
  g.fillRect(sL - 14, slab - 262, 14, 262);
  g.fillRect(sR, slab - 262, 14, 262);
  g.fillRect(sL - 14, slab - 272, 14 + 20, 12);
  g.fillRect(sR - 20, slab - 272, 34, 12);
  // floor slab
  g.fillStyle(C.slab);
  g.fillRect(0, slab, sL, H - slab);
  g.fillRect(sR, slab, W - sR, H - slab);
  g.fillStyle(C.slabTop);
  g.fillRect(0, slab, sL, 6);
  g.fillRect(sR, slab, W - sR, 6);
  // elevator shaft
  g.fillStyle(C.shaft);
  g.fillRect(sL, 0, sR - sL, H);
  g.fillStyle(0x1e1a30);
  g.fillRect(sL, slab + 4, sR - sL, 22);
  g.fillStyle(C.rail);
  g.fillRect(sL + 6, 0, 8, H);
  g.fillRect(sR - 14, 0, 8, H);
  g.fillStyle(0x9d98c4);
  for (let y = 20; y < H; y += 64) {
    g.fillCircle(sL + 10, y, 3);
    g.fillCircle(sR - 10, y, 3);
  }
}

function drawSkyline(g, W, H) {
  const layers = [
    { color: 0xa3b8e8, lit: 0xfff7cf, min: 90, max: 240, alpha: 1 },
    { color: 0x6b7fbf, lit: 0xfff0a8, min: 50, max: 170, alpha: 1 },
  ];
  for (const layer of layers) {
    let x = -20;
    while (x < W) {
      const bw = randInt(40, 120);
      const bh = randInt(layer.min, layer.max);
      g.fillStyle(layer.color, layer.alpha);
      g.fillRect(x, H - bh, bw, bh);
      if (Math.random() < 0.3) g.fillRect(x + bw * 0.4, H - bh - 18, 4, 18);
      g.fillStyle(layer.lit, 0.8);
      for (let wy = H - bh + 10; wy < H - 10; wy += 16) {
        for (let wx = x + 8; wx < x + bw - 8; wx += 14) {
          if (Math.random() < 0.35) g.fillRect(wx, wy, 6, 8);
        }
      }
      x += bw + randInt(4, 16);
    }
  }
}

function drawCarBack(g, skin, w, h) {
  const ink = CONFIG.colors.ink;
  g.fillStyle(skin.back, skin.backAlpha);
  g.fillRect(0, 0, w, h);
  if (skin.pattern === 'wood') {
    g.fillStyle(skin.panel);
    g.fillRect(0, h * 0.5, w, h * 0.5);
    g.lineStyle(2, 0x8a4f2a, 0.6);
    for (let x = 34; x < w; x += 42) g.lineBetween(x, h * 0.5, x, h);
  } else if (skin.pattern === 'glass') {
    g.lineStyle(3, 0xffffff, 0.35);
    for (let x = -h; x < w; x += 70) g.lineBetween(x, h, x + h, 0);
  } else if (skin.pattern === 'gold') {
    g.fillStyle(skin.panel);
    g.fillRect(0, h * 0.55, w, h * 0.45);
    g.fillStyle(0xffffff, 0.6);
    for (let i = 0; i < 18; i++) {
      const sx = rand(10, w - 10), sy = rand(10, h - 10);
      g.fillTriangle(sx, sy - 5, sx + 2, sy, sx - 2, sy);
      g.fillTriangle(sx, sy + 5, sx + 2, sy, sx - 2, sy);
    }
  } else if (skin.pattern === 'dots') {
    const cols = CONFIG.colors.confetti;
    let k = 0;
    for (let y = 18; y < h; y += 34) {
      for (let x = ((y / 34) % 2) * 17 + 14; x < w; x += 34) {
        g.fillStyle(cols[k++ % cols.length]);
        g.fillCircle(x, y, 8);
      }
    }
  }
  // handrail
  g.fillStyle(skin.trim);
  g.fillRect(10, h * 0.46, w - 20, 7);
  g.lineStyle(2, ink, 0.6);
  g.strokeRect(10, h * 0.46, w - 20, 7);
  g.lineStyle(4, ink);
  g.strokeRect(0, 0, w, h);
}

function drawDoor(g, skin, w, h) {
  g.fillStyle(skin.door, skin.doorAlpha);
  g.fillRect(0, 0, w, h);
  if (skin.pattern === 'dots') {
    g.fillStyle(skin.panel);
    for (let y = 0; y < h; y += 24) g.fillRect(0, y, w, 12);
  }
  g.fillStyle(skin.trim);
  g.fillRect(0, 0, 4, h);
  g.fillRect(w - 4, 0, 4, h);
  g.fillStyle(0xffffff, 0.35);
  g.fillRect(w * 0.35, 8, 3, h - 16);
  g.lineStyle(3, CONFIG.colors.ink);
  g.strokeRect(0, 0, w, h);
}

function drawHeader(g, skin, w, h) {
  g.fillStyle(skin.frame);
  g.fillRoundedRect(0, 0, w, h, 10);
  g.fillStyle(skin.trim);
  g.fillRect(8, h - 12, w - 16, 5);
  g.fillStyle(0x151222);
  g.fillRoundedRect(w / 2 - 44, 8, 88, h - 24, 6);
  g.lineStyle(4, CONFIG.colors.ink);
  g.strokeRoundedRect(0, 0, w, h, 10);
  // cable hook
  g.fillStyle(0x9aa0b5);
  g.fillRect(w / 2 - 8, -2, 16, 10);
}

function drawButton(g, w, h, color) {
  const ink = CONFIG.colors.ink;
  const r = Math.min(18, h / 2);
  g.fillStyle(ink);
  g.fillRoundedRect(0, 6, w, h - 6, r);
  g.fillStyle(color);
  g.fillRoundedRect(0, 0, w, h - 6, r);
  g.fillStyle(0xffffff, 0.25);
  g.fillRoundedRect(6, 4, w - 12, (h - 6) * 0.38, r * 0.7);
  g.lineStyle(4, ink);
  g.strokeRoundedRect(2, 2, w - 4, h - 8, r);
}

function generateTextures(scene) {
  const C = CONFIG.colors;
  // ragdoll parts
  for (const key of TYPE_KEYS) {
    const t = CONFIG.types[key];
    makeTex(scene, `torso_${key}`, t.torso[0] + 6, t.torso[1] + 6, (g) => drawTorso(g, key, t));
    makeTex(scene, `legs_${key}`, t.legs[0] + 6, t.legs[1] + 6, (g) => drawLegs(g, key, t));
    CONFIG.skinTones.forEach((tone, i) => {
      const size = (t.headR + Math.ceil(t.headR * 0.6)) * 2;
      for (const face of FACES) {
        makeTex(scene, `head_${key}_${i}_${face}`, size, size, (g) => drawHead(g, key, t, tone, face));
      }
      makeTex(scene, `arm_${key}_${i}`, t.arm[0] + 6, t.arm[1] + 6, (g) => drawArm(g, t, tone, false));
      if (key === 'manager') {
        makeTex(scene, `arm_${key}_${i}_cup`, t.arm[0] + 6, t.arm[1] + 6, (g) => drawArm(g, t, tone, true));
      }
    });
  }

  // particles
  makeTex(scene, 'confetti', 10, 6, (g) => { g.fillStyle(0xffffff); g.fillRect(0, 0, 10, 6); });
  makeTex(scene, 'paper', 16, 20, (g) => {
    g.fillStyle(0xffffff); g.fillRect(0, 0, 16, 20);

    for (let y = 4; y < 18; y += 4) g.fillRect(3, y, 10, 1);

  makeTex(scene, 'dot', 12, 12, (g) => { g.fillStyle(0xffffff); g.fillCircle(6, 6, 6); });
  makeTex(scene, 'spark', 8, 8, (g) => { g.fillStyle(0xfff3a0); g.fillCircle(4, 4, 4); g.fillStyle(0xffffff); g.fillCircle(4, 4, 2); });
  makeTex(scene, 'debris', 14, 10, (g) => { g.fillStyle(0xffffff); g.fillTriangle(0, 10, 14, 8, 6, 0); });
  makeTex(scene, 'puff', 32, 32, (g) => {
    for (let i = 8; i >= 1; i--) { g.fillStyle(0xffffff, 0.12); g.fillCircle(16, 16, i * 2); }
  });
  makeTex(scene, 'speedline', 4, 120, (g) => { g.fillStyle(0xffffff, 0.8); g.fillRect(0, 0, 4, 120); });
  makeTex(scene, 'cloud', 220, 90, (g) => {

  // UI
  makeTex(scene, 'doorsBtn', 136, 136, (g) => {

    g.fillStyle(0xffffff, 0.3); g.fillEllipse(68, 40, 80, 32);
    g.lineStyle(5, C.ink); g.strokeCircle(68, 66, 58);
    g.fillStyle(C.ink);
    g.fillTriangle(26, 44, 26, 88, 58, 66);
    g.fillTriangle(110, 44, 110, 88, 78, 66);

  makeTex(scene, 'gaugeFace', 240, 140, (g) => {

    g.lineStyle(4, 0xff4757);
    g.lineBetween(34, 20, 46, 36); g.lineBetween(46, 20, 34, 36);
  });
}

function ensureButtonTex(scene, w, h, color) {
  const key = `btn_${w}_${h}_${color.toString(16)}`;
  makeTex(scene, key, w, h, (g) => drawButton(g, w, h, color));
  return key;
}

function ensureSkinTex(scene, skin) {
  const L = CONFIG.layout;
  const w = L.carRight - L.carLeft;
  const h = L.floorY - L.carTop;
  makeTex(scene, `carBack_${skin.id}`, w, h, (g) => drawCarBack(g, skin, w, h));
  makeTex(scene, `carDoor_${skin.id}`, L.wall, h, (g) => drawDoor(g, skin, L.wall, h));
  makeTex(scene, `carHeader_${skin.id}`, w + L.wall * 2 + 16, 64, (g) => drawHeader(g, skin, w + L.wall * 2 + 16, 64));
  makeTex(scene, `carFloor_${skin.id}`, w + L.wall * 2 + 16, 44, (g) => {
    const fw = w + L.wall * 2 + 16;
    g.fillStyle(skin.floor); g.fillRoundedRect(0, 0, fw, 44, 8);
    g.fillStyle(skin.trim); g.fillRect(6, 4, fw - 12, 5);
    g.lineStyle(4, CONFIG.colors.ink); g.strokeRoundedRect(0, 0, fw, 44, 8);
  });
}

// A chunky button: image + label, press feedback, fires on release
function makeButton(scene, x, y, w, h, label, color, onClick, fontSize) {
  const key = ensureButtonTex(scene, w, h, color);
  const bg = scene.add.image(x, y, key).setInteractive({ useHandCursor: true });
  const txt = scene.add.text(x, y - 3, label, textStyle(fontSize || Math.round(h * 0.38), '#ffffff')).setOrigin(0.5);
  let down = false;
  bg.on('pointerdown', () => { down = true; bg.setScale(0.94); txt.setScale(0.94); Sound.unlock(); });
  bg.on('pointerout', () => { down = false; bg.setScale(1); txt.setScale(1); });
  bg.on('pointerup', () => {
    bg.setScale(1); txt.setScale(1);
    if (down) { down = false; Sound.pop(); onClick(); }
  });
  return { bg, txt, setDepth(d) { bg.setDepth(d); txt.setDepth(d + 1); return this; } };
}

// =====================================================================
//  Worker: one ragdoll office worker, built from 5 Matter bodies
// =====================================================================
let workerSeq = 0;

class Worker {
  constructor(scene, typeKey, x, feetY, opts) {
    opts = opts || {};
    const t = CONFIG.types[typeKey];
    this.scene = scene;
    this.typeKey = typeKey;
    this.type = t;
    this.id = ++workerSeq;
    this.tone = opts.tone != null ? opts.tone : randInt(0, CONFIG.skinTones.length - 1);
    this.state = opts.state || 'queue';
    this.face = '';
    this.alive = true;
    this.slotX = x;
    this.targetX = x;
    this.patience = 1;
    this.patienceMax = 1;
    this.inside = false;
    this.wasInside = false;
    this.scored = false;
    this.progressX = x;
    this.stuckT = 0;
    this.hopCD = 0;
    this.bumpCD = 0;
    this.coffeeCD = 0;
    this.trailCD = 0;
    this.launched = false;

    const group = -this.id; // parts of one ragdoll never collide with each other
    const bodyFilter = { group, category: CAT.BODY, mask: CAT.WORLD | CAT.DOOR | CAT.BODY };
    const armFilter = { group, category: CAT.LIMB, mask: CAT.WORLD };
    const base = { friction: t.friction, frictionAir: t.frictionAir, restitution: t.restitution, density: t.density, sleepThreshold: 50 };
    const [tw, th] = t.torso;
    const [aw, ah] = t.arm;
    const [lw, lh] = t.legs;
    const r = t.headR;
    const legsY = feetY - lh / 2;
    const hipY = legsY - lh / 2 + 3;
    const torsoY = hipY - th / 2 + 3;
    const neckY = torsoY - th / 2;
    const headY = neckY - r + 4;
    const shoulderY = torsoY - th / 2 + aw * 0.6;
    const armY = shoulderY + ah / 2 - aw * 0.5;
    const add = scene.matter.add;
    const tone = this.tone;

    this.legs = add.image(x, legsY, `legs_${typeKey}`, null, Object.assign({}, base, {
      shape: { type: 'rectangle', width: lw, height: lh }, chamfer: { radius: Math.min(8, lw * 0.3) },
      friction: t.friction * 1.2, collisionFilter: Object.assign({}, bodyFilter),
    }));
    this.torso = add.image(x, torsoY, `torso_${typeKey}`, null, Object.assign({}, base, {
      shape: { type: 'rectangle', width: tw, height: th }, chamfer: { radius: Math.min(8, tw * 0.25) },
      collisionFilter: Object.assign({}, bodyFilter),
    }));
    this.head = add.image(x, headY, `head_${typeKey}_${tone}_calm`, null, Object.assign({}, base, {
      shape: { type: 'circle', radius: r }, density: t.density * 0.8,
      collisionFilter: Object.assign({}, bodyFilter),
    }));
    const armOpts = () => Object.assign({}, base, {
      shape: { type: 'rectangle', width: aw, height: ah }, chamfer: { radius: aw * 0.45 },
      density: t.density * 0.6, collisionFilter: Object.assign({}, armFilter),
    });
    this.armL = add.image(x - tw / 2 - aw * 0.3, armY, `arm_${typeKey}_${tone}`, null, armOpts());
    this.armR = add.image(x + tw / 2 + aw * 0.3, armY, typeKey === 'manager' ? `arm_${typeKey}_${tone}_cup` : `arm_${typeKey}_${tone}`, null, armOpts());

    this.parts = [this.legs, this.torso, this.armL, this.armR, this.head];
    this.bodies = this.parts.map((p) => p.body);
    const depth = 20 + (this.id % 40) * 0.05;
    this.legs.setDepth(depth);
    this.torso.setDepth(depth + 0.01);
    this.armL.setDepth(depth + 0.02);
    this.armR.setDepth(depth + 0.02);
    this.head.setDepth(depth + 0.03);

    const c = scene.matter.add;
    const S = CONFIG.physics.jointStiffness;
    const pin = (a, b, ax, ay, bx, by) => c.constraint(a, b, 0, S, { pointA: { x: ax, y: ay }, pointB: { x: bx, y: by }, damping: 0.1 });
    this.postures = [
      c.constraint(this.torso, this.head, undefined, t.posture, { damping: 0.05 }),
      c.constraint(this.torso, this.legs, undefined, t.posture, { damping: 0.05 }),
    ];
    this.joints = [
      pin(this.torso, this.head, 0, -th / 2, 0, r - 4),
      pin(this.torso, this.legs, 0, th / 2 - 3, 0, -lh / 2 + 3),
      pin(this.torso, this.armL, -tw / 2 + aw * 0.2, -th / 2 + aw * 0.6, aw * 0.5, -ah / 2 + aw * 0.5),
      pin(this.torso, this.armR, tw / 2 - aw * 0.2, -th / 2 + aw * 0.6, -aw * 0.5, -ah / 2 + aw * 0.5),
    ].concat(this.postures);

    this.setFace(opts.face || 'calm');
  }

  get x() { return this.torso.body.position.x; }
  get y() { return this.torso.body.position.y; }

  wake() {
    for (let i = 0; i < 5; i++) {
      const b = this.bodies[i];
      if (b.isSleeping) MSleeping.set(b, false);
    }
  }

  setState(s) {
    this.state = s;
    this.stuckT = 0;
    this.progressX = this.x;
    this.wake();
  }

  setFace(face) {
    if (face === this.face) return;
    this.face = face;
    this.head.setTexture(`head_${this.typeKey}_${this.tone}_${face}`);
  }

  setFloppy(floppy) {
    for (const c of this.postures) c.stiffness = floppy ? 0.02 : this.type.posture;
  }

  // Workers who give up walk off through everyone else (keeps the pile stable)
  ghost() {
    for (const b of this.bodies) b.collisionFilter.mask = CAT.WORLD;
  }

  isInsideCar(sag) {
    const L = CONFIG.layout;
    const x = this.x, y = this.y;
    return x > L.carLeft + 4 && x < L.carRight - 4 && y > L.carTop - 10 + sag && y < L.floorY + sag;
  }

  push(dx, dy) {
    this.wake();
    for (const b of this.bodies) setVel(b, velX(b) + dx, velY(b) + dy);
  }

  hop(power, dirX) {
    this.wake();
    const vy = -CONFIG.physics.hopSpeed * power;
    for (const b of this.bodies) setVel(b, velX(b) + dirX, Math.min(velY(b), vy));
  }

  // Called before every fixed physics step: walking and staying upright
  physicsStep() {
    const P = CONFIG.physics;
    const T = this.torso.body;
    const t = this.type;
    let mode = 'none';
    let targetVx = null;
    switch (this.state) {
      case 'queue': {
        mode = 'stand';
        const dx = this.slotX - this.x;
        if (Math.abs(dx) > 5) targetVx = clamp(dx * 0.08, -t.run, t.run);
        break;
      }
      case 'boarding': {
        mode = 'stand';
        const sprint = t.run * P.panicSprint;
        targetVx = clamp((this.targetX - this.x) * 0.1, -sprint, sprint);
        break;
      }
      case 'exiting':
        mode = 'stand';
        targetVx = -t.run;
        break;
      case 'leaving':
        mode = 'stand';
        targetVx = t.run;
        break;
      case 'riding':
        mode = 'sway';
        break;
      default:
        break;
    }

    const legs = this.legs.body;
    legs.friction = targetVx !== null ? P.walkFriction : t.friction * 1.2;
    if (targetVx !== null) {
      if (T.isSleeping) this.wake();
      const blend = P.walkBlend;
      for (let i = 0; i < 5; i++) {
        const b = this.bodies[i];
        const cvx = velX(b);
        setVel(b, cvx + (targetVx - cvx) * blend, velY(b));
      }
    }

    if (mode === 'stand') {
      // Walkers stay firmly on their feet: rotate torso and legs back toward upright.
      if (!T.isSleeping) {
        uprightStep(T, P.standStrength);
        uprightStep(legs, P.standStrength);
      }
    } else if (mode === 'sway' && !T.isSleeping) {
      const a = wrapAngle(T.angle);
      if (Math.abs(a) > 0.6) {
        uprightStep(T, P.getUpStrength);
        uprightStep(legs, P.getUpStrength);
      } else {
        const w = angVel(T);
        if (Math.abs(a) > 0.02 || Math.abs(w) > 0.005) MBody.setAngularVelocity(T, w * P.uprightDamping - a * P.swayStrength);
      }
    }
  }

  // Called after every physics step: keep the ragdoll from exploding
  clampVelocity(maxSpeed, maxAngular) {
    const max2 = maxSpeed * maxSpeed;
    for (let i = 0; i < 5; i++) {
      const b = this.bodies[i];
      if (b.isSleeping) continue;
      const x = velX(b), y = velY(b);
      const s2 = x * x + y * y;
      if (s2 > max2) {
        const f = maxSpeed / Math.sqrt(s2);
        setVel(b, x * f, y * f);
      }
      const w = angVel(b);
      if (w > maxAngular) MBody.setAngularVelocity(b, maxAngular);
      else if (w < -maxAngular) MBody.setAngularVelocity(b, -maxAngular);
    }
  }

  // Track progress so stuck walkers hop over obstacles
  updateStuck(dt, dirX) {
    this.hopCD -= dt;
    if ((this.x - this.progressX) * dirX > 6) {
      this.progressX = this.x;
      this.stuckT = 0;
      return false;
    }
    this.stuckT += dt;
    if (this.stuckT > CONFIG.physics.stuckMs && this.hopCD <= 0) {
      this.hopCD = 700;
      this.stuckT = 0;
      this.progressX = this.x;
      this.hop(1, dirX * 1.5);
      return true;
    }
    return false;
  }

  launch(heightFactor) {
    const Lc = CONFIG.launch;
    const L = CONFIG.layout;
    const cx = (L.carLeft + L.carRight) / 2;
    this.state = 'launched';
    this.launched = true;
    this.setFloppy(true);
    this.setFace('scream');
    this.wake();
    const up = -(Lc.base + Lc.heightBonus * heightFactor) * this.type.launchMult * rand(0.92, 1.08);
    const side = rand(-Lc.sideJitter, Lc.sideJitter) + clamp((this.x - cx) * Lc.spread, -1.5, 1.5);
    for (const b of this.bodies) {
      b.frictionAir = Lc.frictionAir;
      setVel(b, side + rand(-1, 1), up + rand(-2, 2));
      MBody.setAngularVelocity(b, rand(-Lc.spin, Lc.spin));
    }
  }

  fadeOut(ms) {
    if (!this.alive || this.fading) return;
    this.fading = true;
    this.scene.tweens.add({ targets: this.parts, alpha: 0, duration: ms, onComplete: () => this.destroy() });
  }

  destroy() {
    if (!this.alive) return;
    this.alive = false;
    const world = this.scene.matter.world;
    if (world) {
      for (const c of this.joints) world.removeConstraint(c);
    }
    for (const p of this.parts) p.destroy();
  }
}

class MenuScene extends Phaser.Scene {
  constructor() { super({ key: 'Menu', physics: MATTER_SCENE_CONFIG }); }

  create() {
    const W = CONFIG.width, H = CONFIG.height;
    this.acc = 0;
    this.rain = [];
    this.cameras.main.setBackgroundColor(CONFIG.colors.skyStops[0][1]);
    Sound.setIntensity(0);

    this.add.image(W / 2, H - 110, 'skyline').setOrigin(0.5, 1).setAlpha(0.9);
    const g = this.add.graphics();
    g.fillStyle(0x514b7a);
    g.fillRect(0, H - 110, W, 110);
    g.fillStyle(0x3d3862);
    g.fillRect(0, H - 110, W, 10);

    // A tiny tower with an elevator going up and down behind the title
    g.fillStyle(0x6c63a8);
    g.fillRect(W / 2 - 120, 150, 240, H - 260);
    g.fillStyle(0x2a2540);
    g.fillRect(W / 2 - 22, 150, 44, H - 260);
    g.fillStyle(0xfff0a8, 0.8);
    for (let y = 170; y < H - 130; y += 40) {
      for (const x of [W / 2 - 100, W / 2 - 64, W / 2 + 36, W / 2 + 72]) g.fillRect(x, y, 24, 22);
    }
    const lift = this.add.rectangle(W / 2, H - 150, 36, 44, 0xffd23f).setStrokeStyle(4, CONFIG.colors.ink);
    this.tweens.add({ targets: lift, y: 190, duration: 2600, ease: 'Sine.easeInOut', yoyo: true, repeat: -1, hold: 400, repeatDelay: 400 });

    const title1 = this.add.text(W / 2, 96, 'RAGDOLL', textStyle(92, '#ffd23f', { strokeThickness: 14 })).setOrigin(0.5).setDepth(5);
    const title2 = this.add.text(W / 2, 184, 'ELEVATOR RUSH', textStyle(64, '#ffffff', { strokeThickness: 12 })).setOrigin(0.5).setDepth(5);
    title1.setShadow(6, 8, '#1d1b2e', 0, true, true);
    title2.setShadow(5, 7, '#1d1b2e', 0, true, true);
    this.tweens.add({ targets: title1, angle: { from: -2.5, to: 2.5 }, duration: 1300, ease: 'Sine.easeInOut', yoyo: true, repeat: -1 });
    this.tweens.add({ targets: title2, scale: { from: 1, to: 1.05 }, duration: 900, ease: 'Sine.easeInOut', yoyo: true, repeat: -1 });

    // physics: ground, title shelf, and play button so ragdolls pile on them
    const statics = { isStatic: true, friction: 0.8, collisionFilter: { group: 0, category: CAT.WORLD, mask: 0xffff } };
    this.matter.add.rectangle(W / 2, H - 80, W * 3, 60, statics);
    this.matter.add.rectangle(W / 2, 228, 560, 16, statics);
    this.matter.add.rectangle(W / 2, 400, 320, 90, statics);

    this.playBtn = makeButton(this, W / 2, 400, 320, 100, 'PLAY', 0x2ecc71, () => this.startGame(), 46).setDepth(10);
    this.shopBtn = makeButton(this, W / 2, 520, 240, 76, 'SHOP', 0x4ea8ff, () => this.openShop(), 32).setDepth(10);

    this.bestText = this.add.text(24, 20, '', textStyle(26, '#ffffff', { align: 'left' })).setDepth(10);
    this.coinIcon = this.add.image(38, 84, 'coin').setDepth(10);
    this.coinText = this.add.text(60, 68, '', textStyle(26, '#ffd23f', { align: 'left' })).setDepth(10);
    this.refreshStats();

    this.muteBtn = this.add.image(W - 44, 44, Save.data.muted ? 'iconMute' : 'iconSound').setInteractive({ useHandCursor: true }).setDepth(10);
    this.muteBtn.on('pointerup', () => this.toggleMute());

    this.add.text(W / 2, H - 42,
      'Tap the big DOORS button to go  •  Hold it to wait  •  Drag workers around  •  Don\'t snap the cable!',
      textStyle(18, '#ffffff', { fontFamily: UI_FONT, strokeThickness: 5 })).setOrigin(0.5).setDepth(10);

    this.input.keyboard.addCapture('SPACE');
    this.input.keyboard.on('keydown-SPACE', () => { if (!this.shop) this.startGame(); });
    this.input.on('pointerdown', () => Sound.unlock());

    this.rainTimer = this.time.addEvent({ delay: 1100, loop: true, callback: () => this.spawnRain() });
    this.spawnRain();
  }

  refreshStats() {
    this.bestText.setText(`BEST ${Save.data.best}`);
    this.coinText.setText(String(Save.data.coins));
  }

  toggleMute() {
    Sound.unlock();
    Save.data.muted = !Save.data.muted;
    Sound.setMuted(Save.data.muted);
    Save.write();
    this.muteBtn.setTexture(Save.data.muted ? 'iconMute' : 'iconSound');
  }

  spawnRain() {
    if (this.rain.length >= 7) {
      const old = this.rain.shift();
      old.fadeOut(300);
    }
    const key = TYPE_KEYS[weightedIndex([0.5, 0.3, 0.2])];
    const w = new Worker(this, key, rand(120, CONFIG.width - 120), -40, { state: 'menu', face: 'scream' });
    w.setFloppy(true);
    for (const b of w.bodies) MBody.setAngularVelocity(b, rand(-0.2, 0.2));
    this.rain.push(w);
  }

  update(time, delta) {
    this.acc += Math.min(delta, 100);
    let n = 0;
    while (this.acc >= CONFIG.physics.stepMs && n < CONFIG.physics.maxStepsPerFrame) {
      this.matter.world.step(CONFIG.physics.stepMs);
      for (const w of this.rain) if (w.alive) w.clampVelocity(CONFIG.physics.maxSpeedLaunched, CONFIG.physics.maxAngularLaunched);
      this.acc -= CONFIG.physics.stepMs;
      n++;
    }
    if (n >= CONFIG.physics.maxStepsPerFrame) this.acc = 0;
    for (let i = this.rain.length - 1; i >= 0; i--) {
      const w = this.rain[i];
      if (!w.alive || w.y > CONFIG.height + 200) { w.destroy(); this.rain.splice(i, 1); }
    }
  }

  startGame() {
    Sound.unlock();
    this.scene.start('Game');
  }

  // ---- shop overlay ----------------------------------------------------
  openShop() {
    if (this.shop) return;
    const W = CONFIG.width, H = CONFIG.height;
    const items = [];
    const shade = this.add.rectangle(W / 2, H / 2, W, H, 0x000000, 0.6).setInteractive().setDepth(50);
    const panel = this.add.graphics().setDepth(51);
    panel.fillStyle(CONFIG.colors.ink); panel.fillRoundedRect(W / 2 - 520, 90, 1040, 540, 28);
    panel.fillStyle(0x2d2850); panel.fillRoundedRect(W / 2 - 510, 100, 1020, 520, 24);
    items.push(shade, panel);
    items.push(this.add.text(W / 2, 150, 'ELEVATOR SKINS', textStyle(44, '#ffd23f')).setOrigin(0.5).setDepth(52));
    const msg = this.add.text(W / 2, 540, '', textStyle(22, '#ffffff', { fontFamily: UI_FONT })).setOrigin(0.5).setDepth(52);
    items.push(msg);

    const cards = [];
    const render = () => {
      for (const c of cards) c.forEach((o) => o.destroy());
      cards.length = 0;
      CONFIG.skins.forEach((skin, i) => {
        const x = W / 2 - 360 + i * 240, y = 340;
        const owned = Save.data.owned.includes(skin.id);
        const equipped = Save.data.skin === skin.id;
        const card = this.add.graphics().setDepth(52);
        card.fillStyle(equipped ? 0xffd23f : CONFIG.colors.ink);
        card.fillRoundedRect(x - 105, y - 150, 210, 300, 18);
        card.fillStyle(0x3f3970);
        card.fillRoundedRect(x - 99, y - 144, 198, 288, 14);
        const preview = this.add.image(x, y - 50, `carBack_${skin.id}`).setScale(0.44).setDepth(53);
        const header = this.add.image(x, y - 50 - 58, `carHeader_${skin.id}`).setScale(0.44).setDepth(53);
        const name = this.add.text(x, y + 40, skin.name, textStyle(24, '#ffffff')).setOrigin(0.5).setDepth(53);
        const label = equipped ? 'EQUIPPED' : owned ? 'EQUIP' : `${skin.price} COINS`;
        const status = this.add.text(x, y + 92, label, textStyle(20, equipped ? '#ffd23f' : owned ? '#3ddc84' : '#ffffff')).setOrigin(0.5).setDepth(53);
        const hit = this.add.zone(x, y, 210, 300).setInteractive({ useHandCursor: true }).setDepth(54);
        hit.on('pointerup', () => {
          if (owned) {
            Save.data.skin = skin.id;
            Save.write();
            Sound.pop();
            msg.setText(`${skin.name} equipped!`);
          } else if (Save.data.coins >= skin.price) {
            Save.data.coins -= skin.price;
            Save.data.owned.push(skin.id);
            Save.data.skin = skin.id;
            Save.write();
            Sound.coin();
            msg.setText(`Bought ${skin.name}! Looking fancy.`);
            this.refreshStats();
          } else {
            Sound.hmph();
            msg.setText(`You need ${skin.price - Save.data.coins} more coins. Launch more coworkers!`);
            this.tweens.add({ targets: [card, preview, header, name, status], x: '+=8', duration: 50, yoyo: true, repeat: 3 });
            return;
          }
          // Rebuild after this input event finishes (never destroy the object being clicked).
          this.time.delayedCall(0, render);
        });
        cards.push([card, preview, header, name, status, hit]);
      });
    };
    render();

    const close = makeButton(this, W / 2, 594, 200, 64, 'CLOSE', 0xff4f81, () => {
      this.time.delayedCall(0, () => {
        for (const c of cards) c.forEach((o) => o.destroy());
        for (const o of items) o.destroy();
        close.bg.destroy();
        close.txt.destroy();
        this.shop = null;
      });
    }, 28).setDepth(55);
    this.shop = { items, cards };
  }
}
